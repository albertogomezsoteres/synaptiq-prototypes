<!doctype html>

<meta name="description" content="Synaptiq: three interactive prototypes for closing knowledge gaps in engineering teams.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Cpath d=%27M6.5 20.5C10.5 12 17 16.5 21.5 7.5%27 fill=%27none%27 stroke=%27%230a7468%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%276.5%27 cy=%2720.5%27 r=%273.8%27 fill=%27%230a7468%27/%3E%3Ccircle cx=%2721.5%27 cy=%277.5%27 r=%273.8%27 fill=%27%230a7468%27/%3E%3C/svg%3E">
<title>Ask Synaptiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Synaptiq UI kit. App shell: left rail (workspace, navigation, guided steps) beside a scrolling work area under a scenario band. */
:root {
  --paper: #f2f5f6;
  --surface: #ffffff;
  --sunk: #e9eef0;
  --ink: #13202a;
  --muted: #566672;
  --faint: #8796a1;
  --line: #d6dfe4;
  --line-strong: #b9c6cd;
  --brand: #0a7468;
  --brand-deep: #075a51;
  --brand-ink: #ffffff;
  --brand-weak: #e0f2ee;
  --gap: #9d5b00;
  --gap-weak: #fff0d4;
  --risk: #b42318;
  --risk-weak: #fdeceb;
  --focus: #2f6fdb;
  --band: #13202a;
  --band-ink: #eef3f4;
  --shadow: 0 1px 2px rgba(19, 32, 42, .05), 0 8px 24px -12px rgba(19, 32, 42, .18);
  --shadow-lift: 0 2px 4px rgba(19, 32, 42, .06), 0 18px 36px -16px rgba(19, 32, 42, .28);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --r-sm: 7px;
  --r-md: 11px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1317; --surface: #131c21; --sunk: #19242a; --ink: #e3eaed; --muted: #98a7b1; --faint: #6d7c86;
    --line: #233139; --line-strong: #344651; --brand: #3cc1b0; --brand-deep: #5fd4c4; --brand-ink: #052823; --brand-weak: #0f2f2b;
    --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #7aa7ff; --band: #1c2930; --band-ink: #e3eaed;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1317; --surface: #131c21; --sunk: #19242a; --ink: #e3eaed; --muted: #98a7b1; --faint: #6d7c86;
  --line: #233139; --line-strong: #344651; --brand: #3cc1b0; --brand-deep: #5fd4c4; --brand-ink: #052823; --brand-weak: #0f2f2b;
  --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #7aa7ff; --band: #1c2930; --band-ink: #e3eaed;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: color-mix(in srgb, var(--brand) 28%, transparent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
code, .code { font-family: var(--f-code); font-size: .84em; background: var(--sunk); padding: .1em .38em; border-radius: 5px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
p { margin: 0; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px 16px;
  overflow-y: auto;
}
.rail > * { animation: rise .55s var(--ease) both; }
.rail > *:nth-child(2) { animation-delay: .05s; }
.rail > *:nth-child(3) { animation-delay: .1s; }
.rail > *:nth-child(4) { animation-delay: .15s; }
.rail > *:nth-child(5) { animation-delay: .2s; }
.main { animation: fade .5s .1s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }

.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); text-decoration: none; }
.brand svg { width: 28px; height: 28px; flex: none; transition: transform .5s var(--spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.06); }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.workspace { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color .2s, background .2s; }
.workspace:hover { border-color: var(--line-strong); background: var(--paper); }
.ws-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; }
.ws-meta { min-width: 0; line-height: 1.25; }
.ws-meta strong { display: block; font-size: 14px; }
.ws-meta span { font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px 7px 12px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px;
  transition: background .18s, color .18s, padding .25s var(--ease);
}
.nav a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--brand); transform: scaleY(0); transition: transform .25s var(--ease); }
.nav a:hover { background: var(--paper); color: var(--ink); padding-left: 15px; }
.nav a.on { background: var(--sunk); color: var(--ink); font-weight: 600; }
.nav a.on::before { transform: scaleY(1); }
.nav .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
.nav .count.bump { animation: bump .6s var(--spring); color: var(--brand); font-weight: 700; }
@keyframes bump { 40% { transform: scale(1.45); } }

/* guided steps */
.try { display: flex; flex-direction: column; gap: 10px; }
.try h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.try ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.try li { display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start; font-size: 13.5px; line-height: 1.35; color: var(--muted); padding: 8px; border-radius: var(--r-sm); transition: background .3s, color .3s; }
.try li .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--faint); transition: all .3s var(--ease); }
.try li .tick svg { width: 12px; height: 12px; }
.try li.just .tick path { stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw .45s .15s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.try li.now { background: var(--brand-weak); color: var(--ink); }
.try li.now .tick { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
.try li.done { color: var(--faint); }
.try li.done span:last-child { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.try li.done .tick { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.try li.just .tick { animation: pop .45s var(--spring); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.try .finished { font-size: 13px; color: var(--brand); font-weight: 600; padding: 0 8px; animation: rise .4s var(--ease) both; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--faint); }
.rail-foot a { color: var(--muted); text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: color .2s; }
.rail-foot a:hover { color: var(--brand); text-decoration-color: currentColor; }

/* work area */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scenario {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--band); color: var(--band-ink);
}
.scenario .who { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); }
.scenario p { flex: 1 1 320px; min-width: 0; font-size: 14.5px; line-height: 1.4; }
.scenario p b { font-weight: 650; }
.scenario .restart {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--band-ink); border: 1px solid color-mix(in srgb, var(--band-ink) 32%, transparent);
  padding: 6px 12px; border-radius: 999px; font-size: 13px; transition: background .2s, border-color .2s;
}
.scenario .restart svg { width: 14px; height: 14px; transition: transform .5s var(--ease); }
.scenario .restart:hover { background: color-mix(in srgb, var(--band-ink) 12%, transparent); border-color: color-mix(in srgb, var(--band-ink) 55%, transparent); }
.scenario .restart:hover svg { transform: rotate(-200deg); }
.work { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.work-inner {
  max-width: 880px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- elements ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; line-height: 1.2;
  transition: background .18s, border-color .18s, color .18s, box-shadow .25s var(--ease), transform .25s var(--ease);
}
.btn:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(19, 32, 42, .35); }
.btn:active { transform: translateY(0) scale(.98); box-shadow: none; transition-duration: .08s; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; transition: transform .3s var(--spring); }
.btn:hover svg { transform: scale(1.12); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 650; line-height: 1.3; white-space: nowrap; animation: pop .35s var(--spring) both; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--brand-weak); color: var(--brand); }
.pill.gap { background: var(--gap-weak); color: var(--gap); }
.pill.gap::before { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.pill.risk { background: var(--risk-weak); color: var(--risk); }
.pill.plain { background: var(--sunk); color: var(--muted); }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-display); color: #fff; flex: none; transition: transform .3s var(--spring), box-shadow .3s; }
.avatar:hover { transform: scale(1.1); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--line-strong); }
.av-1 { background: #6d5bd0; } .av-2 { background: #c2570c; } .av-3 { background: #1f7a4d; } .av-4 { background: #2e6ac9; } .av-5 { background: #a1366e; }
.online { position: relative; }
.online::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: #22a06b; border: 2px solid var(--surface); }

/* knowledge card: an answer that carries its own evidence */
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; transition: border-color .25s, box-shadow .35s var(--ease), transform .35s var(--ease); }
.kcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); }
.kcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.kcard-head h3 { font-size: 15.5px; }
.kcard-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.trail li { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 4px 6px 12px 0; font-size: 13.5px; line-height: 1.4; border-radius: 8px; animation: rise .45s var(--ease) both; }
.trail li:nth-child(2) { animation-delay: .12s; }
.trail li:nth-child(3) { animation-delay: .24s; }
.trail li:nth-child(4) { animation-delay: .36s; }
.trail li:last-child { padding-bottom: 4px; }
.trail li::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: -4px; width: 1.5px; background: var(--line-strong); transform-origin: top; animation: grow .5s .2s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } }
.trail li:last-child::before { display: none; }
.trail .node { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); display: grid; place-items: center; margin-top: 1px; position: relative; z-index: 1; transition: transform .3s var(--spring), box-shadow .3s; }
.trail .node::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.trail li:hover .node { transform: scale(1.18); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.trail .node.miss { border-color: var(--gap); border-style: dashed; }
.trail .node.miss::after { background: transparent; border: 1.5px solid var(--gap); width: 4px; height: 4px; }
.trail li:hover .node.miss { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gap) 18%, transparent); }
.trail .k { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin: 0; }
.facts div { background: var(--surface); padding: 10px 16px; min-width: 0; transition: background .2s; }
.facts div:hover { background: var(--paper); }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }

/* toast */
.toasts { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(72px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  position: relative; overflow: hidden; pointer-events: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  padding: 11px 14px 13px; border-radius: var(--r-md); font-size: 14px; line-height: 1.4;
  box-shadow: 0 16px 36px -12px rgba(19, 32, 42, .38);
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in .45s var(--spring) both;
}
.toast .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; margin-top: 1px; }
.toast .dot svg { width: 11px; height: 11px; }
.toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--brand); transform-origin: left; animation: shrink 4.2s linear forwards; }
.toast.leaving { animation: toast-out .3s var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(24px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(24px); } }
@keyframes shrink { to { transform: scaleX(0); } }

/* thinking indicator */
.thinking { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; color: var(--muted); }
.thinking .step { display: flex; align-items: center; gap: 9px; animation: rise .3s var(--ease) both; }
.thinking .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .7s linear infinite; flex: none; }
.thinking .step:not(.done) span:last-child {
  background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.3s linear infinite;
}
.thinking .step.done .spin { animation: pop .3s var(--spring); border-color: var(--brand); background: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }

/* streaming caret */
.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--brand); animation: caret .9s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

.reveal { animation: reveal .45s var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } }
.cue { animation: cue 2s var(--ease) infinite; }
@keyframes cue { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 10px transparent; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- narrow ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; overflow: visible; }
  .rail .workspace, .rail .nav, .rail-foot { display: none; }
  .try { flex: 1 1 100%; gap: 6px; }
  .try h4 { display: none; }
  .try ol { flex-direction: row; gap: 6px; }
  .try li { flex: 1; grid-template-columns: 22px 1fr; padding: 6px; font-size: 12px; }
  .try li:not(.now) span:last-child { display: none; }
  .try li:not(.now) { flex: 0 0 auto; }
  .scenario { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; gap: 10px; flex-wrap: nowrap; align-items: flex-start; }
  .scenario .who { display: none; }
  .scenario p { flex: 1 1 auto; font-size: 13px; line-height: 1.38; }
  .scenario .restart { padding: 5px 10px; font-size: 12px; white-space: nowrap; }
  .toasts { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; }
  .work-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
}

/* Version A: chat thread with evidence-carrying answers */
.thread { display: flex; flex-direction: column; gap: 22px; }
.empty { display: flex; flex-direction: column; gap: 14px; padding-top: 6vh; }
.empty h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.12; max-width: 18ch; }
.empty p { color: var(--muted); max-width: 52ch; }
.suggest { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.suggest button {
  text-align: left; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 11px 14px 11px 11px; font-size: 15px;
  transition: border-color .2s, box-shadow .3s var(--ease), transform .3s var(--ease);
  animation: rise .5s var(--ease) both;
}
.suggest button:nth-child(2) { animation-delay: .08s; }
.suggest button:nth-child(3) { animation-delay: .16s; }
.suggest .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); transition: background .25s, color .25s, transform .35s var(--spring); }
.suggest .ic svg { width: 17px; height: 17px; }
.suggest button:hover { border-color: var(--brand); transform: translateX(4px); box-shadow: var(--shadow); }
.suggest button:hover .ic { background: var(--brand-weak); color: var(--brand); transform: rotate(-6deg) scale(1.06); }
.suggest button small { color: var(--faint); font-size: 12.5px; white-space: nowrap; transition: color .2s; }
.suggest button:hover small { color: var(--brand); }
.q { align-self: flex-end; max-width: min(560px, 88%); background: var(--band); color: var(--band-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; transform-origin: bottom right; animation: bubble .4s var(--spring) both; }
@keyframes bubble { from { opacity: 0; transform: scale(.92) translateY(6px); } }
.a { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.a-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-weak); color: var(--brand); display: grid; place-items: center; animation: pop .4s var(--spring) both; }
.a-mark svg { width: 18px; height: 18px; }
.a-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lead { font-size: 15px; line-height: 1.55; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.warn { background: var(--gap-weak); color: var(--ink); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; }
.warn b { color: var(--gap); }
.expert { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; padding: 12px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); transition: border-color .25s, background .25s; }
.expert:hover { border-color: var(--brand); background: color-mix(in srgb, var(--brand-weak) 45%, transparent); }
.expert .who { flex: 1 1 220px; min-width: 0; font-size: 14px; line-height: 1.4; }
.expert .who strong { display: block; }
.expert .who span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.draft { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--sunk); border-radius: var(--r-md); }
.draft textarea { width: 100%; min-height: 104px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.attach { display: flex; gap: 6px; flex-wrap: wrap; }
.attach span { font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); font-family: var(--f-code); transition: border-color .2s, color .2s; }
.attach span:hover { border-color: var(--brand); color: var(--brand); }
.waiting { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.waiting .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.saved-note { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--brand); font-weight: 600; }
.recap { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.recap h2 { font-size: 20px; }
.recap p { color: var(--muted); max-width: 60ch; }
.composer {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.composer form { max-width: 832px; margin: 0 auto; display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-md); padding: 11px 14px; font-size: 15px; transition: border-color .2s, box-shadow .25s, background .2s; }
.composer input:hover { border-color: var(--line-strong); }
.composer input:focus { outline: none; border-color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.composer .btn svg { transition: transform .35s var(--spring); }
.composer .btn:hover svg { transform: translate(2px, -2px) rotate(-8deg); }
.chips { max-width: 832px; margin: 0 auto 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); transition: border-color .2s, color .2s, background .2s, transform .25s var(--ease); animation: rise .4s var(--ease) both; }
.chips button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-weak); transform: translateY(-1px); }
.chips button[disabled] { opacity: .5; transform: none; }
@media (max-width: 860px) {
  .composer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .empty { padding-top: 0; }
  .suggest button small { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-bottom: 8px; scrollbar-width: none; }
  .chips button { white-space: nowrap; }
}
</style>
</head>
<body>


<div class="app">
  <aside class="rail">
    <a class="brand" id="brand" href="../" aria-label="Synaptiq, all versions"></a>
    <div class="workspace"><div class="ws-logo">C</div><div class="ws-meta"><strong>Corvex Payments</strong><span>Engineering workspace</span></div></div>
    <nav class="nav" aria-label="Synaptiq">
      <a class="on" href="#ask" onclick="return false">Ask</a>
      <a href="#saved" onclick="return false">Saved answers <span class="count" id="savedCount">128</span></a>
      <a href="#mine" onclick="return false">My questions <span class="count" id="mineCount">0</span></a>
    </nav>
    <section class="try" id="try" aria-label="Demo steps"></section>
    <div class="rail-foot">
      <span>Version A of 3</span>
      <a href="../">All three versions</a>
    </div>
  </aside>

  <div class="main">
    <div class="scenario">
      <div class="who" aria-hidden="true">S</div>
      <p><b>You're Sam, a backend engineer three weeks into Corvex Payments.</b> Your first task is a change to the payments-retry service, which you've never worked on.</p>
      <button class="restart" id="restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restart demo</button>
    </div>
    <div class="work" id="work"><div class="work-inner"><div class="thread" id="thread"></div></div></div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <form id="ask">
        <label class="sr-only" for="askInput">Ask Synaptiq</label>
        <input id="askInput" autocomplete="off" placeholder="Ask about any Corvex system…">
        <button class="btn primary" type="submit" id="askBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>Ask</button>
      </form>
    </div>
  </div>
</div>

<script>
/* Synaptiq UI kit: shared helpers */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? Math.min(ms, 60) : ms));
let RUN = 0; // increments on restart so pending async flows stop
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const RESTART_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
const alive = (id) => id === RUN;

const LOGO = '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6.5 20.5C10.5 12 17 16.5 21.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="6.5" cy="20.5" r="3.6" fill="currentColor"/><circle cx="21.5" cy="7.5" r="3.6" fill="currentColor"/><circle cx="14" cy="14.3" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.7"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function toast(msg) {
  let box = $(".toasts");
  if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="dot">' + TICK + '</span><span>' + msg + '</span><span class="bar"></span>';
  box.appendChild(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => { t.classList.add("leaving"); setTimeout(() => t.remove(), 320); }, 4200);
}

/* stream words into an element, keeping inline markup intact by revealing tokens */
async function stream(el, html, id, speed = 18) {
  el.classList.add("typing");
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const words = [];
  (function walk(node, parent) {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        n.textContent.split(/(\s+)/).forEach((w) => { if (w) words.push({ parent, text: w }); });
      } else {
        const clone = n.cloneNode(false);
        words.push({ parent, node: clone });
        walk(n, clone);
      }
    });
  })(tmp, el);
  for (const w of words) {
    if (!alive(id)) return;
    if (w.node) w.parent.appendChild(w.node);
    else { w.parent.appendChild(document.createTextNode(w.text)); if (/\S/.test(w.text)) await wait(speed); }
  }
  el.classList.remove("typing");
}

/* animate a number change */
function countTo(el, to, suffix = "") {
  if (!el) return;
  const from = parseInt(el.textContent, 10) || 0;
  if (from === to) { el.textContent = to + suffix; return; }
  const t0 = performance.now(), dur = REDUCED ? 1 : 700;
  el.classList.add("bump");
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e) + suffix;
    if (k < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove("bump"), 500);
  })(t0);
}

/* "Try this" checklist in the rail */
function Checklist(root, steps) {
  let done = 0, just = -1;
  function render() {
    root.innerHTML = "<h4>Try this</h4><ol>" + steps.map((s, i) => {
      const cls = (i < done ? "done" : i === done ? "now" : "") + (i === just ? " just" : "");
      const mark = i < done ? TICK : String(i + 1);
      return '<li class="' + cls + '"><span class="tick" aria-hidden="true">' + mark + "</span><span>" + s + "</span></li>";
    }).join("") + "</ol>" + (done >= steps.length ? '<p class="finished">All steps done. Restart to run it again.</p>' : "");
  }
  render();
  return {
    complete(i) { if (i < done) return; just = i; done = i + 1; render(); },
    reset() { done = 0; just = -1; render(); },
    get step() { return done; },
  };
}

/* thinking steps; resolves after all are shown */
async function think(container, labels, id, each = 650) {
  const box = document.createElement("div");
  box.className = "thinking";
  container.appendChild(box);
  for (const l of labels) {
    if (!alive(id)) return box;
    const s = document.createElement("div");
    s.className = "step";
    s.innerHTML = '<span class="spin"></span><span>' + l + "</span>";
    box.appendChild(s);
    await wait(each);
    s.classList.add("done");
  }
  return box;
}

function scrollDown(el) {
  el.scrollTo({ top: el.scrollHeight, behavior: REDUCED ? "auto" : "smooth" });
  clearTimeout(el._sd);
  el._sd = setTimeout(() => el.scrollTo({ top: el.scrollHeight, behavior: "auto" }), 420);
}

const Q = {
  setup: "How do I run the payments-retry tests locally?",
  why: "Why does payments-retry only retry 3 times?",
  dash: "Which dashboard shows retry failures?",
};
const IC = {
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>',
  why: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.2v.3"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};
let S, steps;
const thread = $("#thread"), work = $("#work"), chips = $("#chips"), input = $("#askInput");
$("#brand").innerHTML = LOGO + "<b>Synaptiq</b>";

function init() {
  RUN++;
  S = { busy: false, sent: false, saved: false, reused: 0, mine: 0 };
  steps = Checklist($("#try"), [
    "Ask a question Synaptiq can answer",
    "Ask one it can't answer, and send it to the right expert",
    "Ask that question again",
  ]);
  $("#savedCount").textContent = "128";
  $("#mineCount").textContent = "0";
  thread.innerHTML = `
    <div class="empty reveal">
      <h1>Ask anything about how Corvex works</h1>
      <p>Every answer shows where it came from, who owns it and when it was last checked. When nobody has written the answer down, Synaptiq says so and finds the person who knows.</p>
      <div class="suggest">
        <button type="button" class="cue" data-q="setup"><span class="ic">${IC.doc}</span><span>${Q.setup}</span><small>Documented</small></button>
        <button type="button" data-q="why"><span class="ic">${IC.why}</span><span>${Q.why}</span><small>Never written down</small></button>
        <button type="button" data-q="dash"><span class="ic">${IC.clock}</span><span>${Q.dash}</span><small>Possibly outdated</small></button>
      </div>
    </div>`;
  $$(".suggest button", thread).forEach((b) => b.addEventListener("click", () => ask(Q[b.dataset.q])));
  chips.innerHTML = "";
  input.value = "";
  setBusy(false);
  work.scrollTop = 0;
}

function setBusy(b) { S.busy = b; $("#askBtn").disabled = b; input.disabled = b; $$("button", chips).forEach((c) => (c.disabled = b)); }

function setChips(list) {
  chips.innerHTML = list.map((k) => `<button type="button" data-q="${k}" ${k === "why" && S.saved && !S.reused ? 'class="cue"' : ""}>${Q[k]}</button>`).join("");
  $$("button", chips).forEach((b) => b.addEventListener("click", () => ask(Q[b.dataset.q])));
}

function route(text) {
  const t = text.toLowerCase();
  if (/(why|reason).*(retr|3|three|limit)|(retr).*(3|three|limit|only)/.test(t)) return "why";
  if (/dashboard|grafana|monitor|failure|alert/.test(t)) return "dash";
  if (/test|local|setup|set up|run|install|dev/.test(t)) return "setup";
  return null;
}

$("#ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v || S.busy) return;
  input.value = "";
  ask(v);
});
$("#restart").addEventListener("click", init);

function answerShell() {
  const a = document.createElement("div");
  a.className = "a";
  a.innerHTML = `<div class="a-mark">${LOGO}</div><div class="a-body"></div>`;
  thread.appendChild(a);
  return $(".a-body", a);
}

async function ask(text) {
  if (S.busy) return;
  const id = RUN;
  const empty = $(".empty", thread);
  if (empty) empty.remove();
  S.mine++; countTo($("#mineCount"), S.mine);
  const q = document.createElement("div");
  q.className = "q reveal";
  q.textContent = text;
  thread.appendChild(q);
  setBusy(true);
  const body = answerShell();
  scrollDown(work);
  const kind = route(text);
  if (kind === "setup") await answerSetup(body, id);
  else if (kind === "why") await answerWhy(body, id);
  else if (kind === "dash") await answerDash(body, id);
  else await answerUnknown(body, id);
  if (!alive(id)) return;
  setBusy(false);
  const left = ["setup", "why", "dash"].filter((k) => k !== kind);
  setChips(S.saved && !S.reused ? ["why", ...left.filter((k) => k !== "why")] : left);
  scrollDown(work);
}

async function answerSetup(body, id) {
  const t = await think(body, ["Searching docs, runbooks and READMEs", "Checking who owns it and when it was reviewed"], id, 600);
  if (!alive(id)) return;
  t.remove();
  const card = document.createElement("article");
  card.className = "kcard reveal";
  card.innerHTML = `
    <div class="kcard-head"><h3>Run payments-retry tests locally</h3><span class="pill ok">Verified answer</span></div>
    <div class="kcard-body">
      <p class="lead" data-s></p>
      <ol class="steps" hidden>
        <li>Request read access to <code>payments-test-db</code> in the access portal. It's usually approved within the hour.</li>
        <li>Start the dev container: <code>./scripts/dev-up payments-retry</code></li>
        <li>Run the suite: <code>make test SERVICE=payments-retry</code></li>
      </ol>
      <div hidden data-src>
        <p class="label">Where this comes from</p>
        <ul class="trail">
          <li><span class="node"></span><span><b>payments-retry / README.md</b>, Local setup section<br><span class="k">Last edited 12 days ago by Dana Whitfield</span></span></li>
          <li><span class="node"></span><span><b>Platform runbook: Dev containers</b><br><span class="k">Confirms the access step for shared test databases</span></span></li>
        </ul>
      </div>
    </div>
    <dl class="facts" hidden>
      <div><dt>Owner</dt><dd>Platform Eng · Dana Whitfield</dd></div>
      <div><dt>Applies to</dt><dd>payments-retry, all environments</dd></div>
      <div><dt>Last reviewed</dt><dd>12 days ago</dd></div>
      <div><dt>Used by</dt><dd>23 engineers this quarter</dd></div>
    </dl>`;
  body.appendChild(card);
  await stream($("[data-s]", card), "You need access to the shared test database first, then you can start the service's dev container and run its test target.", id);
  if (!alive(id)) return;
  for (const sel of [".steps", "[data-src]", ".facts"]) { await wait(220); if (!alive(id)) return; const e = $(sel, card); e.hidden = false; e.classList.add("reveal"); scrollDown(work); }
  steps.complete(0);
}

async function answerWhy(body, id) {
  if (S.saved) return answerWhySaved(body, id);
  const t = await think(body, ["Searching docs and runbooks", "Reading the code history of retry/policy.go", "Checking related tickets"], id, 700);
  if (!alive(id)) return;
  t.remove();
  const card = document.createElement("article");
  card.className = "kcard reveal";
  card.innerHTML = `
    <div class="kcard-head"><h3>Why payments-retry stops after 3 retries</h3><span class="pill gap">No verified answer</span></div>
    <div class="kcard-body">
      <p class="lead" data-s></p>
      <div hidden data-src>
        <p class="label">What Synaptiq checked</p>
        <ul class="trail">
          <li><span class="node"></span><span><b>Code:</b> <code>RETRY_LIMIT = 3</code> in <code>retry/policy.go</code><br><span class="k">Set in commit <code>a41f9c2</code>, March 2023. Commit message: "adjust retries"</span></span></li>
          <li><span class="node miss"></span><span><b>Docs:</b> 2 pages mention retries<br><span class="k">Neither explains why the limit is 3</span></span></li>
          <li><span class="node miss"></span><span><b>Tickets:</b> PAY-1182 mentions "downstream load"<br><span class="k">No decision was recorded</span></span></li>
        </ul>
      </div>
      <div class="expert" hidden data-exp>
        <span class="avatar av-1 online">MC</span>
        <div class="who"><strong>Maria Chen is most likely to know</strong><span>Staff engineer, Payments. She made this change and reviewed 31 of the last 40 pull requests in payments-retry.</span></div>
        <div class="row" data-actions>
          ${S.sent ? '<span class="pill plain">Already sent to Maria</span>' : '<button class="btn primary cue" type="button" data-ask>Ask Maria</button>'}
        </div>
      </div>
    </div>`;
  body.appendChild(card);
  await stream($("[data-s]", card), "Nobody has written down why this limit exists. Rather than guess, here is everything I checked, so you don't have to search it all again.", id);
  if (!alive(id)) return;
  for (const sel of ["[data-src]", "[data-exp]"]) { await wait(250); if (!alive(id)) return; const e = $(sel, card); e.hidden = false; e.classList.add("reveal"); scrollDown(work); }
  const btn = $("[data-ask]", card);
  if (btn) btn.addEventListener("click", () => openDraft(card, id));
}

function openDraft(card, id) {
  const actions = $("[data-actions]", card);
  actions.innerHTML = "";
  const d = document.createElement("div");
  d.className = "draft reveal";
  d.innerHTML = `
    <label class="label" for="toMaria">Your question to Maria (edit it if you like)</label>
    <textarea id="toMaria">Hi Maria, I'm changing payments-retry and want to understand why it stops after 3 retries before I touch it. I found commit a41f9c2 ("adjust retries") and PAY-1182, which mentions downstream load, but no recorded reason.</textarea>
    <div class="attach" aria-label="Attached automatically"><span>commit a41f9c2</span><span>PAY-1182</span><span>What Synaptiq searched</span></div>
    <p class="k" style="font-size:13px;color:var(--muted)">Synaptiq attaches the evidence it found, so Maria can answer without asking you follow-up questions. It goes to her Synaptiq inbox, not her DMs.</p>
    <div class="row"><button class="btn primary cue" type="button" data-send>Send to Maria</button><button class="btn quiet" type="button" data-cancel>Cancel</button></div>`;
  $(".kcard-body", card).appendChild(d);
  scrollDown(work);
  $("[data-cancel]", d).addEventListener("click", () => { d.remove(); actions.innerHTML = '<button class="btn primary" type="button" data-ask>Ask Maria</button>'; $("[data-ask]", actions).addEventListener("click", () => openDraft(card, id)); });
  $("[data-send]", d).addEventListener("click", () => sendToMaria(card, d, id));
}

async function sendToMaria(card, d, id) {
  S.sent = true;
  d.remove();
  $("[data-actions]", card).innerHTML = '<span class="pill plain">Sent to Maria</span>';
  toast("Sent to Maria Chen with the evidence attached.");
  setBusy(true);
  const body = answerShell();
  const w = document.createElement("div");
  w.className = "waiting reveal";
  w.innerHTML = '<span class="spin"></span><span>Waiting for Maria. She usually answers within 2 hours.</span><button class="btn" type="button" data-skip>Skip ahead to her reply</button>';
  body.appendChild(w);
  scrollDown(work);
  let skipped = false;
  $("[data-skip]", w).addEventListener("click", () => { skipped = true; });
  for (let i = 0; i < 70 && !skipped; i++) { await wait(100); if (!alive(id)) return; }
  if (!alive(id)) return;
  w.remove();
  const card2 = document.createElement("article");
  card2.className = "kcard reveal";
  card2.innerHTML = `
    <div class="kcard-head"><h3>Why payments-retry stops after 3 retries</h3><span class="pill ok">Verified by Maria Chen</span></div>
    <div class="kcard-body">
      <div class="row"><span class="avatar av-1">MC</span><span class="label">Maria Chen replied</span></div>
      <p class="lead" data-s></p>
    </div>
    <dl class="facts">
      <div><dt>Confirmed by</dt><dd>Maria Chen, Payments</dd></div>
      <div><dt>Applies to</dt><dd>payments-retry only</dd></div>
      <div><dt>Valid until</dt><dd>ledger-gw v2 ships (PAY-1410)</dd></div>
      <div><dt>Review again</dt><dd>April 2027</dd></div>
    </dl>`;
  body.appendChild(card2);
  scrollDown(work);
  await stream($("[data-s]", card2), "The limit protects <b>ledger-gw v1</b>, our legacy settlement gateway. It starts dropping requests when a transaction is retried more than 3 times in a burst. Don't raise it until the ledger-gw v2 migration (PAY-1410) ships.", id, 22);
  if (!alive(id)) return;
  await wait(300);
  const note = document.createElement("div");
  note.className = "saved-note reveal";
  note.innerHTML = '<span class="pill ok">Saved</span><span>Saved to company memory with its scope and review date.</span>';
  $(".kcard-body", card2).appendChild(note);
  S.saved = true;
  countTo($("#savedCount"), 129);
  toast("Saved. The next engineer who asks gets Maria's answer instantly.");
  steps.complete(1);
  setBusy(false);
  setChips(["why", "dash", "setup"]);
  scrollDown(work);
}

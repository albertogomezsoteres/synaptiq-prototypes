<!doctype html>

<title>Synaptiq Context Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* Synaptiq UI kit. App shell: left rail (workspace, navigation, guided steps) beside a scrolling work area under a scenario band. */
:root {
  --paper: #f2f5f6;
  --surface: #ffffff;
  --sunk: #e9eef0;
  --ink: #13202a;
  --muted: #566672;
  --faint: #8796a1;
  --line: #d6dfe4;
  --line-strong: #b9c6cd;
  --brand: #0a7468;
  --brand-deep: #075a51;
  --brand-ink: #ffffff;
  --brand-weak: #e0f2ee;
  --gap: #9d5b00;
  --gap-weak: #fff0d4;
  --risk: #b42318;
  --risk-weak: #fdeceb;
  --focus: #2f6fdb;
  --band: #13202a;
  --band-ink: #eef3f4;
  --shadow: 0 1px 2px rgba(19, 32, 42, .05), 0 8px 24px -12px rgba(19, 32, 42, .18);
  --shadow-lift: 0 2px 4px rgba(19, 32, 42, .06), 0 18px 36px -16px rgba(19, 32, 42, .28);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --r-sm: 7px;
  --r-md: 11px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1317; --surface: #131c21; --sunk: #19242a; --ink: #e3eaed; --muted: #98a7b1; --faint: #6d7c86;
    --line: #233139; --line-strong: #344651; --brand: #3cc1b0; --brand-deep: #5fd4c4; --brand-ink: #052823; --brand-weak: #0f2f2b;
    --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #7aa7ff; --band: #1c2930; --band-ink: #e3eaed;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1317; --surface: #131c21; --sunk: #19242a; --ink: #e3eaed; --muted: #98a7b1; --faint: #6d7c86;
  --line: #233139; --line-strong: #344651; --brand: #3cc1b0; --brand-deep: #5fd4c4; --brand-ink: #052823; --brand-weak: #0f2f2b;
  --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #7aa7ff; --band: #1c2930; --band-ink: #e3eaed;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: color-mix(in srgb, var(--brand) 28%, transparent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
code, .code { font-family: var(--f-code); font-size: .84em; background: var(--sunk); padding: .1em .38em; border-radius: 5px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
p { margin: 0; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px 16px;
  overflow-y: auto;
}
.rail > * { animation: rise .55s var(--ease) both; }
.rail > *:nth-child(2) { animation-delay: .05s; }
.rail > *:nth-child(3) { animation-delay: .1s; }
.rail > *:nth-child(4) { animation-delay: .15s; }
.rail > *:nth-child(5) { animation-delay: .2s; }
.main { animation: fade .5s .1s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }

.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); text-decoration: none; }
.brand svg { width: 28px; height: 28px; flex: none; transition: transform .5s var(--spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.06); }
.brand b { font-family: var(--f-display); font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.workspace { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color .2s, background .2s; }
.workspace:hover { border-color: var(--line-strong); background: var(--paper); }
.ws-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; }
.ws-meta { min-width: 0; line-height: 1.25; }
.ws-meta strong { display: block; font-size: 14px; }
.ws-meta span { font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px 7px 12px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px;
  transition: background .18s, color .18s, padding .25s var(--ease);
}
.nav a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--brand); transform: scaleY(0); transition: transform .25s var(--ease); }
.nav a:hover { background: var(--paper); color: var(--ink); padding-left: 15px; }
.nav a.on { background: var(--sunk); color: var(--ink); font-weight: 600; }
.nav a.on::before { transform: scaleY(1); }
.nav .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
.nav .count.bump { animation: bump .6s var(--spring); color: var(--brand); font-weight: 700; }
@keyframes bump { 40% { transform: scale(1.45); } }

/* guided steps */
.try { display: flex; flex-direction: column; gap: 10px; }
.try h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.try ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.try li { display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start; font-size: 13.5px; line-height: 1.35; color: var(--muted); padding: 8px; border-radius: var(--r-sm); transition: background .3s, color .3s; }
.try li .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--faint); transition: all .3s var(--ease); }
.try li .tick svg { width: 12px; height: 12px; }
.try li.just .tick path { stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw .45s .15s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.try li.now { background: var(--brand-weak); color: var(--ink); }
.try li.now .tick { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
.try li.done { color: var(--faint); }
.try li.done span:last-child { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.try li.done .tick { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.try li.just .tick { animation: pop .45s var(--spring); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.try .finished { font-size: 13px; color: var(--brand); font-weight: 600; padding: 0 8px; animation: rise .4s var(--ease) both; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--faint); }
.rail-foot a { color: var(--muted); text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: color .2s; }
.rail-foot a:hover { color: var(--brand); text-decoration-color: currentColor; }

/* work area */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scenario {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--band); color: var(--band-ink);
}
.scenario .who { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); }
.scenario p { flex: 1 1 320px; min-width: 0; font-size: 14.5px; line-height: 1.4; }
.scenario p b { font-weight: 650; }
.scenario .restart {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--band-ink); border: 1px solid color-mix(in srgb, var(--band-ink) 32%, transparent);
  padding: 6px 12px; border-radius: 999px; font-size: 13px; transition: background .2s, border-color .2s;
}
.scenario .restart svg { width: 14px; height: 14px; transition: transform .5s var(--ease); }
.scenario .restart:hover { background: color-mix(in srgb, var(--band-ink) 12%, transparent); border-color: color-mix(in srgb, var(--band-ink) 55%, transparent); }
.scenario .restart:hover svg { transform: rotate(-200deg); }
.work { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.work-inner {
  max-width: 880px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- elements ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; line-height: 1.2;
  transition: background .18s, border-color .18s, color .18s, box-shadow .25s var(--ease), transform .25s var(--ease);
}
.btn:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(19, 32, 42, .35); }
.btn:active { transform: translateY(0) scale(.98); box-shadow: none; transition-duration: .08s; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; transition: transform .3s var(--spring); }
.btn:hover svg { transform: scale(1.12); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 650; line-height: 1.3; white-space: nowrap; animation: pop .35s var(--spring) both; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--brand-weak); color: var(--brand); }
.pill.gap { background: var(--gap-weak); color: var(--gap); }
.pill.gap::before { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.pill.risk { background: var(--risk-weak); color: var(--risk); }
.pill.plain { background: var(--sunk); color: var(--muted); }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-display); color: #fff; flex: none; transition: transform .3s var(--spring), box-shadow .3s; }
.avatar:hover { transform: scale(1.1); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--line-strong); }
.av-1 { background: #6d5bd0; } .av-2 { background: #c2570c; } .av-3 { background: #1f7a4d; } .av-4 { background: #2e6ac9; } .av-5 { background: #a1366e; }
.online { position: relative; }
.online::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: #22a06b; border: 2px solid var(--surface); }

/* knowledge card: an answer that carries its own evidence */
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; transition: border-color .25s, box-shadow .35s var(--ease), transform .35s var(--ease); }
.kcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); }
.kcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.kcard-head h3 { font-size: 15.5px; }
.kcard-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.trail li { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 4px 6px 12px 0; font-size: 13.5px; line-height: 1.4; border-radius: 8px; animation: rise .45s var(--ease) both; }
.trail li:nth-child(2) { animation-delay: .12s; }
.trail li:nth-child(3) { animation-delay: .24s; }
.trail li:nth-child(4) { animation-delay: .36s; }
.trail li:last-child { padding-bottom: 4px; }
.trail li::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: -4px; width: 1.5px; background: var(--line-strong); transform-origin: top; animation: grow .5s .2s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } }
.trail li:last-child::before { display: none; }
.trail .node { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); display: grid; place-items: center; margin-top: 1px; position: relative; z-index: 1; transition: transform .3s var(--spring), box-shadow .3s; }
.trail .node::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.trail li:hover .node { transform: scale(1.18); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.trail .node.miss { border-color: var(--gap); border-style: dashed; }
.trail .node.miss::after { background: transparent; border: 1.5px solid var(--gap); width: 4px; height: 4px; }
.trail li:hover .node.miss { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gap) 18%, transparent); }
.trail .k { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin: 0; }
.facts div { background: var(--surface); padding: 10px 16px; min-width: 0; transition: background .2s; }
.facts div:hover { background: var(--paper); }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }

/* toast */
.toasts { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(72px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  position: relative; overflow: hidden; pointer-events: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  padding: 11px 14px 13px; border-radius: var(--r-md); font-size: 14px; line-height: 1.4;
  box-shadow: 0 16px 36px -12px rgba(19, 32, 42, .38);
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in .45s var(--spring) both;
}
.toast .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; margin-top: 1px; }
.toast .dot svg { width: 11px; height: 11px; }
.toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--brand); transform-origin: left; animation: shrink 4.2s linear forwards; }
.toast.leaving { animation: toast-out .3s var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(24px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(24px); } }
@keyframes shrink { to { transform: scaleX(0); } }

/* thinking indicator */
.thinking { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; color: var(--muted); }
.thinking .step { display: flex; align-items: center; gap: 9px; animation: rise .3s var(--ease) both; }
.thinking .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .7s linear infinite; flex: none; }
.thinking .step:not(.done) span:last-child {
  background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.3s linear infinite;
}
.thinking .step.done .spin { animation: pop .3s var(--spring); border-color: var(--brand); background: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }

/* streaming caret */
.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--brand); animation: caret .9s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

.reveal { animation: reveal .45s var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } }
.cue { animation: cue 2s var(--ease) infinite; }
@keyframes cue { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 10px transparent; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- narrow ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; overflow: visible; }
  .rail .workspace, .rail .nav, .rail-foot { display: none; }
  .try { flex: 1 1 100%; gap: 6px; }
  .try h4 { display: none; }
  .try ol { flex-direction: row; gap: 6px; }
  .try li { flex: 1; grid-template-columns: 22px 1fr; padding: 6px; font-size: 12px; }
  .try li:not(.now) span:last-child { display: none; }
  .try li:not(.now) { flex: 0 0 auto; }
  .scenario { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; gap: 10px; flex-wrap: nowrap; align-items: flex-start; }
  .scenario .who { display: none; }
  .scenario p { flex: 1 1 auto; font-size: 13px; line-height: 1.38; }
  .scenario .restart { padding: 5px 10px; font-size: 12px; white-space: nowrap; }
  .toasts { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; }
  .work-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
}

/* Version C: account page where the briefing arrives before any question */
.work-inner { max-width: 1140px; }
.page-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.page-h h1 { font-size: clamp(24px, 3.4vw, 30px); }
.page-h p { color: var(--muted); font-size: 14.5px; max-width: 60ch; }

<body>


<div class="app">
  <aside class="rail">
    <a class="brand" id="brand" href="../" aria-label="Synaptiq, all versions"></a>
    <div class="workspace"><div class="ws-logo">C</div><div class="ws-meta"><strong>Corvex Payments</strong><span>Solutions engineering</span></div></div>
    <nav class="nav" aria-label="Synaptiq">
      <a class="on" href="#accounts" onclick="return false">My accounts <span class="count">3</span></a>
      <a href="#briefings" onclick="return false">Briefings</a>
      <a href="#gaps" onclick="return false">Open gaps <span class="count" id="gapCount">1</span></a>
    </nav>

    </div>
  </aside>

  <div class="main">
    <div class="scenario">
      <div class="who" aria-hidden="true">N</div>
      <p><b>You're Nico, a solutions engineer at Corvex Payments.</b> This morning you were assigned a customer you've never worked with. You haven't asked anything yet.</p>
      <button class="restart" id="restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restart demo</button>
    </div>
    <div class="work" id="work"><div class="work-inner" id="view"></div></div>
  </div>
</div>

<script>
/* Synaptiq UI kit: shared helpers */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? Math.min(ms, 60) : ms));
let RUN = 0; // increments on restart so pending async flows stop
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const RESTART_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
const alive = (id) => id === RUN;

const LOGO = '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6.5 20.5C10.5 12 17 16.5 21.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="6.5" cy="20.5" r="3.6" fill="currentColor"/><circle cx="21.5" cy="7.5" r="3.6" fill="currentColor"/><circle cx="14" cy="14.3" r="2" fill="var(--surface)" stroke="currentColor" stroke-width="1.7"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function toast(msg) {
  let box = $(".toasts");
  if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="dot">' + TICK + '</span><span>' + msg + '</span><span class="bar"></span>';
  box.appendChild(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => { t.classList.add("leaving"); setTimeout(() => t.remove(), 320); }, 4200);
}

/* stream words into an element, keeping inline markup intact by revealing tokens */
async function stream(el, html, id, speed = 18) {
  el.classList.add("typing");
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const words = [];
  (function walk(node, parent) {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        n.textContent.split(/(\s+)/).forEach((w) => { if (w) words.push({ parent, text: w }); });
      } else {
        const clone = n.cloneNode(false);
        words.push({ parent, node: clone });
        walk(n, clone);
      }
    });
  })(tmp, el);
  for (const w of words) {
    if (!alive(id)) return;
    if (w.node) w.parent.appendChild(w.node);
    else { w.parent.appendChild(document.createTextNode(w.text)); if (/\S/.test(w.text)) await wait(speed); }
  }
  el.classList.remove("typing");
}

/* animate a number change */
function countTo(el, to, suffix = "") {
  if (!el) return;
  const from = parseInt(el.textContent, 10) || 0;
  if (from === to) { el.textContent = to + suffix; return; }
  const t0 = performance.now(), dur = REDUCED ? 1 : 700;
  el.classList.add("bump");
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e) + suffix;
    if (k < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove("bump"), 500);
  })(t0);
}

/* "Try this" checklist in the rail */
function Checklist(root, steps) {
  let done = 0, just = -1;
  function render() {
    root.innerHTML = "<h4>Try this</h4><ol>" + steps.map((s, i) => {
      const cls = (i < done ? "done" : i === done ? "now" : "") + (i === just ? " just" : "");
      const mark = i < done ? TICK : String(i + 1);
      return '<li class="' + cls + '"><span class="tick" aria-hidden="true">' + mark + "</span><span>" + s + "</span></li>";
    }).join("") + "</ol>" + (done >= steps.length ? '<p class="finished">All steps done. Restart to run it again.</p>' : "");
  }
  render();
  return {
    complete(i) { if (i < done) return; just = i; done = i + 1; render(); },
    reset() { done = 0; just = -1; render(); },
    get step() { return done; },
  };
}

/* thinking steps; resolves after all are shown */
async function think(container, labels, id, each = 650) {
  const box = document.createElement("div");
  box.className = "thinking";
  container.appendChild(box);
  for (const l of labels) {
    if (!alive(id)) return box;
    const s = document.createElement("div");
    s.className = "step";
    s.innerHTML = '<span class="spin"></span><span>' + l + "</span>";
    box.appendChild(s);
    await wait(each);
    s.classList.add("done");
  }
  return box;
}

function scrollDown(el) {
  el.scrollTo({ top: el.scrollHeight, behavior: REDUCED ? "auto" : "smooth" });
  clearTimeout(el._sd);
  el._sd = setTimeout(() => el.scrollTo({ top: el.scrollHeight, behavior: "auto" }), 420);
}

$("#brand").innerHTML = LOGO + "<b>Synaptiq</b>";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let S, steps;

const EVENTS = [
  { when: "Sep 2026", what: "Payouts moved from daily to weekly", why: "Bluewater's finance team reconciles every Friday.", who: ["JP", 4, "Jordan Park"], src: "BLU-88" },
  { when: "Jul 2026", what: "Manual approval for payouts over $50,000", why: "Bluewater's auditor required it after a duplicate payout.", who: ["JP", 4, "Jordan Park"], src: "BLU-61" },
  { when: "Mar 2026", what: "Extra escalation step added to failed payouts", why: null, who: ["JO", 2, "Jamie Ortiz"], src: "PR #311" },
  { when: "Jan 2026", what: "Webhook retries raised from 3 to 5", why: "Bluewater's ERP times out at month-end and drops webhooks.", who: ["MC", 1, "Maria Chen"], src: "BLU-23" },
  { when: "Nov 2025", what: "Account went live on the standard payout flow", why: "Standard onboarding.", who: ["JO", 2, "Jamie Ortiz"], src: "BLU-1" },
];
const ANSWER = "Bluewater's ops team must get a phone call before any failed payout is retried. It's in their contract (MSA §7.2) after an automatic retry double-paid one of their carriers. Please keep it.";

function init() {
  RUN++;
  S = { stage: "list", closed: false, decided: null, asked: false };
  steps = Checklist($("#try"), ["Open the account you were just assigned", "Close the gap the briefing found", "Decide what to do with your first ticket"]);
  $("#gapCount").textContent = "1";
  renderList();
  $("#work").scrollTop = 0;
}
$("#restart").addEventListener("click", init);

function renderList() {
  $("#view").innerHTML = `
    <div class="page-h reveal"><h1>My accounts</h1><p>Synaptiq prepares a briefing for every account you're assigned, so you start with the history instead of digging for it.</p></div>
    <section class="accounts reveal" aria-label="Accounts">
      <div class="acc new">
        <div class="acc-logo" style="background:#1f5f8b">B</div>
        <div><h3>Bluewater Logistics</h3><p>Freight carrier payouts · Enterprise plan · Assigned to you today</p></div>
        <div class="acc-r"><span class="pill ok">Briefing ready</span><button class="btn primary cue" type="button" data-open-account>Open account</button></div>
      </div>
      <div class="acc">
        <div class="acc-logo" style="background:#7a4fb5">H</div>
        <div><h3>Halden Retail</h3><p>Card payments · Yours since May 2026</p></div>
        <div class="acc-r"><button class="btn" type="button" data-other>Open account</button></div>
      </div>
      <div class="acc">
        <div class="acc-logo" style="background:#2f7d55">N</div>
        <div><h3>Northpine Clinics</h3><p>Patient billing · Yours since February 2026</p></div>
        <div class="acc-r"><button class="btn" type="button" data-other>Open account</button></div>
      </div>
    </section>`;
  $("[data-open-account]").addEventListener("click", openAccount);
  $$("[data-other]").forEach((b) => b.addEventListener("click", () => toast("Your other accounts have no changes since you last opened them. Bluewater Logistics is the new one.")));
}

async function openAccount() {
  const id = RUN;
  S.stage = "account";
  steps.complete(0);
  $("#view").innerHTML = `
    <button class="back" type="button" data-back><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>My accounts</button>
    <div class="acct-head reveal">
      <div class="acc-logo" style="background:#1f5f8b">B</div>
      <div><h1>Bluewater Logistics</h1>
        <div class="acct-meta"><span>Freight carrier payouts</span><span>Live since Nov 2025</span><span>Previous owner: Jamie Ortiz, now on the Platform team</span></div></div>
    </div>
    <div id="acctBody"><section class="panel prep reveal"><h2>Preparing your briefing</h2><div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="prep"></div></section></div>`;
  $("[data-back]").addEventListener("click", () => { RUN++; S.stage = "list"; renderList(); });
  await think($("#prep"), ["Reading 47 tickets and 12 pull requests", "Reading 3 Slack channels and 2 call notes", "Checking which changes have a recorded reason"], id, 620);
  if (!alive(id)) return;
  renderAccount(true);
}

function timeline() {
  return EVENTS.map((e, i) => {
    const isGap = e.why === null;
    const cls = isGap ? (S.closed ? "closed" : "gap") : "";
    const why = isGap
      ? (S.closed ? `<b>Why:</b> ${ANSWER}` : "No reason recorded anywhere")
      : `<b>Why:</b> ${e.why}`;
    const badge = isGap ? (S.closed ? '<span class="pill ok">Verified by Jamie Ortiz</span>' : '<span class="pill gap">Gap</span>' + (S.asked ? "" : '<button class="btn" type="button" data-tl-ask style="padding:3px 10px;font-size:12.5px">Ask Jamie</button>')) : "";
    return `<li class="${cls}" data-ev="${i}">
      <span class="when">${e.when}</span><span class="node" aria-hidden="true"></span>
      <div class="body"><div class="what">${e.what}</div><div class="why">${why}</div>
      <div class="by"><span class="avatar av-${e.who[1]}">${e.who[0]}</span><span>${e.who[2]}</span><span class="src">${e.src}</span>${badge}</div></div></li>`;
  }).join("");
}

function renderAccount(animate) {
  const id = RUN;
  $("#acctBody").innerHTML = `
    <div class="grid2">
      <section class="panel brief ${animate ? "reveal" : ""}">
        <div class="brief-top">
          <h2>Before you touch this account</h2>
          <p class="lead" id="lead">${animate ? "" : leadText()}</p>
          <div class="counts"><span class="pill ok">${S.closed ? 5 : 4} of 5 changes explained</span><span class="pill ${S.closed ? "ok" : "gap"}" id="gapPill">${S.closed ? "No open gaps" : "1 gap"}</span><span class="pill plain">Sources: 47 tickets, 12 PRs, 3 channels</span></div>
        </div>
        <ol class="tl ${animate ? "enter" : ""}" aria-label="What changed, why, and who">${timeline()}</ol>
      </section>
      <div class="side-col">
        <section class="panel gapcard ${S.closed ? "closed" : ""} ${animate ? "reveal" : ""}" id="gapPanel"></section>
        <section class="panel ${animate ? "reveal" : ""}" id="ticketPanel"></section>
        <section class="panel ${animate ? "reveal" : ""}">
          <div class="panel-h"><h2>People who know this account</h2></div>
          <div class="panel-b">
            <div class="person"><span class="avatar av-2">JO</span><div><strong>Jamie Ortiz</strong><span>Made 4 of the last 6 changes · now on Platform</span></div></div>
            <div class="person"><span class="avatar av-4">JP</span><div><strong>Jordan Park</strong><span>Customer success · owns the relationship</span></div></div>
            <div class="person"><span class="avatar av-1">MC</span><div><strong>Maria Chen</strong><span>Payments · changed webhook retries</span></div></div>
          </div>
        </section>
      </div>
    </div>
    <div id="recapSlot"></div>`;
  renderGap();
  renderTicket();
  const tl = $("[data-tl-ask]");
  if (tl) tl.addEventListener("click", () => { openGapDraft(); $("#gapPanel").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); });
  if (animate) stream($("#lead"), leadText(), id, 16);
}

function leadText() {
  return S.closed
    ? "Bluewater runs a customized payout flow: weekly batch payouts, manual approval above $50,000, and a contractual phone call before any failed payout is retried. Every change below now has a reason."
    : "Bluewater runs a customized payout flow: weekly batch payouts, manual approval above $50,000, and an extra escalation step for failed payouts. Four of the five changes below have a recorded reason. One doesn't, and that's where new owners get caught out.";
}

function renderGap() {
  const p = $("#gapPanel");
  if (S.closed) {
    p.classList.add("closed");
    p.innerHTML = `<div class="panel-h"><h2>Gap closed</h2><span class="pill ok">Verified</span></div>
      <div class="panel-b"><p class="gq">Why was the escalation step added to failed payouts?</p>
      <div class="reply">${ANSWER}</div>
      <p class="small">Saved to Bluewater's briefing with Jamie's name and the contract reference, so whoever owns this account next starts with it.</p></div>`;
    return;
  }
  p.innerHTML = `<div class="panel-h"><h2>1 gap Synaptiq found</h2><span class="pill gap">Undocumented</span></div>
    <div class="panel-b">
      <p class="gq">Why was the escalation step added to failed payouts?</p>
      <p class="small">PR #311 has no description, no linked ticket, and no Slack discussion. Synaptiq flagged it before you needed it.</p>
      <div class="person"><span class="avatar av-2 online">JO</span><div><strong>Jamie Ortiz is most likely to know</strong><span>Wrote PR #311 and made 4 of the last 6 changes</span></div></div>
      <div id="gapAct">${S.asked ? "" : '<button class="btn primary cue" type="button" data-gap-ask>Ask Jamie</button>'}</div>
    </div>`;
  const b = $("[data-gap-ask]", p);
  if (b) b.addEventListener("click", openGapDraft);
}

function openGapDraft() {
  $("#gapAct").innerHTML = `<div class="draft reveal">
    <label class="label small" for="toJamie">Message to Jamie (Synaptiq attaches PR #311 and the briefing)</label>
    <textarea id="toJamie">Hi Jamie, I've taken over Bluewater. Why was the escalation step added to failed payouts in March (PR #311)? Is it still needed?</textarea>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-gap-send>Send to Jamie</button><button class="btn quiet" type="button" data-gap-cancel>Cancel</button></div></div>`;
  $("[data-gap-send]").addEventListener("click", sendGap);
  $("[data-gap-cancel]").addEventListener("click", renderGap);
}

async function sendGap() {
  const id = RUN;
  S.asked = true;
  const tlb = $("[data-tl-ask]");
  if (tlb) tlb.remove();
  toast("Sent to Jamie Ortiz with PR #311 attached.");
  $("#gapAct").innerHTML = `<div class="waiting reveal"><span class="spin"></span><span>Waiting for Jamie. He usually answers the same day.</span><button class="btn" type="button" data-skip>Skip ahead to his reply</button></div>`;
  let skipped = false;
  $("[data-skip]").addEventListener("click", () => { skipped = true; });
  for (let i = 0; i < 70 && !skipped; i++) { await wait(100); if (!alive(id)) return; }
  if (!alive(id)) return;
  S.closed = true;
  $("#gapCount").textContent = "0";
  steps.complete(1);
  renderAccount(false);
  const li = $('[data-ev="2"]');
  if (li) li.classList.add("flash");
  toast("Jamie answered. The briefing now explains every change.");
  if (S.decided) { S.decided = null; renderTicket(); }
}

function renderTicket() {
  const p = $("#ticketPanel");
  const v = verdict();
  p.innerHTML = `<div class="panel-h"><h2>Your first ticket</h2></div>
    <div class="panel-b">
      <div class="ticket"><span class="id">BLU-112 · from Bluewater</span><strong>"Can you simplify failed payouts by removing the extra escalation step?"</strong></div>
      <p class="small">Using only the briefing, what do you do?</p>
      <div class="choices">
        <button type="button" data-decide="remove" aria-pressed="${S.decided === "remove"}">Remove the step</button>
        <button type="button" data-decide="keep" aria-pressed="${S.decided === "keep"}">Keep it and explain why</button>
      </div>
      ${v}
    </div>`;
  $$("[data-decide]", p).forEach((b) => b.addEventListener("click", () => decide(b.dataset.decide)));
}

function verdict() {
  if (!S.decided) return "";
  if (!S.closed) {
    return S.decided === "remove"
      ? '<div class="verdict warn reveal" role="status"><b>Not yet.</b>The briefing flagged this step as undocumented, so nobody knows what removing it would break. Close the gap first.</div>'
      : '<div class="verdict warn reveal" role="status"><b>Good instinct, but you can\'t explain why yet.</b>The briefing shows this step has no recorded reason. Close the gap to find out.</div>';
  }
  return S.decided === "remove"
    ? '<div class="verdict bad reveal" role="status"><b>That would break Bluewater\'s contract.</b>Jamie\'s answer is now in the briefing: MSA §7.2 requires a phone call before any failed payout is retried.</div>'
    : '<div class="verdict good reveal" role="status"><b>Right call.</b>You can reply to Bluewater with the reason from their own contract (MSA §7.2), without searching through tickets or waiting on anyone.</div>';
}

function decide(choice) {
  S.decided = choice;
  renderTicket();
  if (S.closed && choice === "keep" && steps.step === 2) {
    steps.complete(2);
    $("#recapSlot").innerHTML = `<section class="recap reveal"><h2>You knew the account before you had to ask</h2>
      <p>The briefing showed what changed, why, and who worked on it, and it flagged the one decision nobody had written down. Jamie answered once, and that answer now sits in the briefing for whoever owns Bluewater next.</p></section>`;
    $("#recapSlot").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "nearest" });
  }
}

init();
</script>

</body>
</html>

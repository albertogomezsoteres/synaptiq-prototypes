<style>
/* Synaptiq UI kit. App shell: left rail (workspace, navigation, guided steps) beside a scrolling work area under a scenario band. */
:root {
  --paper: #f3f6fa;
  --surface: #ffffff;
  --sunk: #e8eef5;
  --ink: #0b1f3a;
  --muted: #51627a;
  --faint: #8493a8;
  --line: #d6dfea;
  --line-strong: #b5c4d6;
  --brand: #0f6bc4;
  --brand-deep: #0a4f99;
  --brand-ink: #ffffff;
  --brand-weak: #e4effb;
  --cyan: #0bb6c7;
  --gap: #9d5b00;
  --gap-weak: #fff0d4;
  --risk: #b42318;
  --risk-weak: #fdeceb;
  --focus: #2f6fdb;
  --band: #072548;
  --band-ink: #eef4fb;
  --wordmark-filter: none;
  --shadow: 0 1px 2px rgba(11, 31, 58, .05), 0 8px 24px -12px rgba(11, 31, 58, .2);
  --shadow-lift: 0 2px 4px rgba(11, 31, 58, .06), 0 18px 36px -16px rgba(11, 31, 58, .3);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --r-sm: 7px;
  --r-md: 11px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #09121d; --surface: #0f1b29; --sunk: #152436; --ink: #e4ecf6; --muted: #98a9bf; --faint: #6b7d95;
    --line: #1f3147; --line-strong: #30475f; --brand: #5aa9ff; --brand-deep: #8cc4ff; --brand-ink: #04162d; --brand-weak: #0f2a4a; --cyan: #3fd3e0;
    --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #9cc2ff; --band: #0f2747; --band-ink: #e4ecf6;
    --wordmark-filter: brightness(0) invert(.94);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #09121d; --surface: #0f1b29; --sunk: #152436; --ink: #e4ecf6; --muted: #98a9bf; --faint: #6b7d95;
  --line: #1f3147; --line-strong: #30475f; --brand: #5aa9ff; --brand-deep: #8cc4ff; --brand-ink: #04162d; --brand-weak: #0f2a4a; --cyan: #3fd3e0;
  --gap: #f0a73a; --gap-weak: #33250d; --risk: #f2766c; --risk-weak: #3a1a18; --focus: #9cc2ff; --band: #0f2747; --band-ink: #e4ecf6;
  --wordmark-filter: brightness(0) invert(.94);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .45), 0 20px 40px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: color-mix(in srgb, var(--brand) 28%, transparent); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
code, .code { font-family: var(--f-code); font-size: .84em; background: var(--sunk); padding: .1em .38em; border-radius: 5px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
p { margin: 0; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px;
  padding: 18px 16px 16px;
  overflow-y: auto;
}
.rail > * { animation: rise .55s var(--ease) both; }
.rail > *:nth-child(2) { animation-delay: .05s; }
.rail > *:nth-child(3) { animation-delay: .1s; }
.rail > *:nth-child(4) { animation-delay: .15s; }
.rail > *:nth-child(5) { animation-delay: .2s; }
.main { animation: fade .5s .1s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }

.brand { display: flex; align-items: center; gap: 10px; color: var(--brand); text-decoration: none; }
.brand .brand-mark { width: 32px; height: 32px; object-fit: contain; flex: none; transition: transform .6s var(--spring); }
.brand:hover .brand-mark { transform: rotate(-14deg) scale(1.08); }
.brand .wordmark { height: 19px; width: auto; display: block; filter: var(--wordmark-filter); }
.workspace { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color .2s, background .2s; }
.workspace:hover { border-color: var(--line-strong); background: var(--paper); }
.ws-logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; }
.ws-meta { min-width: 0; line-height: 1.25; }
.ws-meta strong { display: block; font-size: 14px; }
.ws-meta span { font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px 7px 12px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px;
  transition: background .18s, color .18s, padding .25s var(--ease);
}
.nav a::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--brand); transform: scaleY(0); transition: transform .25s var(--ease); }
.nav a:hover { background: var(--paper); color: var(--ink); padding-left: 15px; }
.nav a.on { background: var(--sunk); color: var(--ink); font-weight: 600; }
.nav a.on::before { transform: scaleY(1); }
.nav .count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
.nav .count.bump { animation: bump .6s var(--spring); color: var(--brand); font-weight: 700; }
@keyframes bump { 40% { transform: scale(1.45); } }

/* guided steps */
.try { display: flex; flex-direction: column; gap: 10px; }
.try h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.try ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.try li { display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: start; font-size: 13.5px; line-height: 1.35; color: var(--muted); padding: 8px; border-radius: var(--r-sm); transition: background .3s, color .3s; }
.try li .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--faint); transition: all .3s var(--ease); }
.try li .tick svg { width: 12px; height: 12px; }
.try li.just .tick path { stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw .45s .15s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.try li.now { background: var(--brand-weak); color: var(--ink); }
.try li.now .tick { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 14%, transparent); }
.try li.done { color: var(--faint); }
.try li.done span:last-child { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.try li.done .tick { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.try li.just .tick { animation: pop .45s var(--spring); }
@keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
.try .finished { font-size: 13px; color: var(--brand); font-weight: 600; padding: 0 8px; animation: rise .4s var(--ease) both; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--faint); }
.rail-foot a { color: var(--muted); text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: color .2s; }
.rail-foot a:hover { color: var(--brand); text-decoration-color: currentColor; }

/* work area */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scenario {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--band); color: var(--band-ink);
}
.scenario .who { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 13px var(--f-display); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); }
.scenario p { flex: 1 1 320px; min-width: 0; font-size: 14.5px; line-height: 1.4; }
.scenario p b { font-weight: 650; }
.scenario .restart {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--band-ink); border: 1px solid color-mix(in srgb, var(--band-ink) 32%, transparent);
  padding: 6px 12px; border-radius: 999px; font-size: 13px; transition: background .2s, border-color .2s;
}
.scenario .restart svg { width: 14px; height: 14px; transition: transform .5s var(--ease); }
.scenario .restart:hover { background: color-mix(in srgb, var(--band-ink) 12%, transparent); border-color: color-mix(in srgb, var(--band-ink) 55%, transparent); }
.scenario .restart:hover svg { transform: rotate(-200deg); }
.work { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.work-inner {
  max-width: 880px; margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- elements ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; line-height: 1.2;
  transition: background .18s, border-color .18s, color .18s, box-shadow .25s var(--ease), transform .25s var(--ease);
}
.btn:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(19, 32, 42, .35); }
.btn:active { transform: translateY(0) scale(.98); box-shadow: none; transition-duration: .08s; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--brand) 70%, transparent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); box-shadow: none; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn svg { width: 16px; height: 16px; flex: none; transition: transform .3s var(--spring); }
.btn:hover svg { transform: scale(1.12); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 650; line-height: 1.3; white-space: nowrap; animation: pop .35s var(--spring) both; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--brand-weak); color: var(--brand); }
.pill.gap { background: var(--gap-weak); color: var(--gap); }
.pill.gap::before { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.pill.risk { background: var(--risk-weak); color: var(--risk); }
.pill.plain { background: var(--sunk); color: var(--muted); }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-display); color: #fff; flex: none; transition: transform .3s var(--spring), box-shadow .3s; }
.avatar:hover { transform: scale(1.1); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--line-strong); }
.av-1 { background: #6d5bd0; } .av-2 { background: #c2570c; } .av-3 { background: #1f7a4d; } .av-4 { background: #2e6ac9; } .av-5 { background: #a1366e; }
.online { position: relative; }
.online::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: #22a06b; border: 2px solid var(--surface); }

/* knowledge card: an answer that carries its own evidence */
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; transition: border-color .25s, box-shadow .35s var(--ease), transform .35s var(--ease); }
.kcard:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); }
.kcard-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.kcard-head h3 { font-size: 15.5px; }
.kcard-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.trail li { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 4px 6px 12px 0; font-size: 13.5px; line-height: 1.4; border-radius: 8px; animation: rise .45s var(--ease) both; }
.trail li:nth-child(2) { animation-delay: .12s; }
.trail li:nth-child(3) { animation-delay: .24s; }
.trail li:nth-child(4) { animation-delay: .36s; }
.trail li:last-child { padding-bottom: 4px; }
.trail li::before { content: ""; position: absolute; left: 8px; top: 20px; bottom: -4px; width: 1.5px; background: var(--line-strong); transform-origin: top; animation: grow .5s .2s var(--ease) both; }
@keyframes grow { from { transform: scaleY(0); } }
.trail li:last-child::before { display: none; }
.trail .node { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); display: grid; place-items: center; margin-top: 1px; position: relative; z-index: 1; transition: transform .3s var(--spring), box-shadow .3s; }
.trail .node::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.trail li:hover .node { transform: scale(1.18); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
.trail .node.miss { border-color: var(--gap); border-style: dashed; }
.trail .node.miss::after { background: transparent; border: 1.5px solid var(--gap); width: 4px; height: 4px; }
.trail li:hover .node.miss { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gap) 18%, transparent); }
.trail .k { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); margin: 0; }
.facts div { background: var(--surface); padding: 10px 16px; min-width: 0; transition: background .2s; }
.facts div:hover { background: var(--paper); }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }

/* toast */
.toasts { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(72px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  position: relative; overflow: hidden; pointer-events: auto;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  padding: 11px 14px 13px; border-radius: var(--r-md); font-size: 14px; line-height: 1.4;
  box-shadow: 0 16px 36px -12px rgba(19, 32, 42, .38);
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in .45s var(--spring) both;
}
.toast .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; margin-top: 1px; }
.toast .dot svg { width: 11px; height: 11px; }
.toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--brand); transform-origin: left; animation: shrink 4.2s linear forwards; }
.toast.leaving { animation: toast-out .3s var(--ease) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(24px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(24px); } }
@keyframes shrink { to { transform: scaleX(0); } }

/* thinking indicator */
.thinking { display: flex; flex-direction: column; gap: 7px; font-size: 13.5px; color: var(--muted); }
.thinking .step { display: flex; align-items: center; gap: 9px; animation: rise .3s var(--ease) both; }
.thinking .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .7s linear infinite; flex: none; }
.thinking .step:not(.done) span:last-child {
  background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.3s linear infinite;
}
.thinking .step.done .spin { animation: pop .3s var(--spring); border-color: var(--brand); background: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }

/* streaming caret */
.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--brand); animation: caret .9s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

.reveal { animation: reveal .45s var(--ease) both; }
@keyframes reveal { from { opacity: 0; transform: translateY(8px); } }
.cue { animation: cue 2s var(--ease) infinite; }
@keyframes cue { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 10px transparent; } }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- narrow ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; overflow: visible; }
  .rail .workspace, .rail .nav, .rail-foot { display: none; }
  .try { flex: 1 1 100%; gap: 6px; }
  .try h4 { display: none; }
  .try ol { flex-direction: row; gap: 6px; }
  .try li { flex: 1; grid-template-columns: 22px 1fr; padding: 6px; font-size: 12px; }
  .try li:not(.now) span:last-child { display: none; }
  .try li:not(.now) { flex: 0 0 auto; }
  .scenario { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; gap: 10px; flex-wrap: nowrap; align-items: flex-start; }
  .scenario .who { display: none; }
  .scenario p { flex: 1 1 auto; font-size: 13px; line-height: 1.38; }
  .scenario .restart { padding: 5px 10px; font-size: 12px; white-space: nowrap; }
  .toasts { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; }
  .work-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
}

.live-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;font-size:13px}.live-bar .btn{font-size:12px;padding:5px 8px}.live-dialog{width:min(720px,94vw);max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:24px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.live-dialog::backdrop{background:#07254888;backdrop-filter:blur(4px)}.live-dialog-body{display:grid;gap:16px;margin-top:20px}.live-dialog label{display:grid;gap:8px}.live-dialog input,.field input{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:12px;color:var(--ink);font:inherit}.live-document{padding:16px 0;border-top:1px solid var(--line)}.live-document pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;max-height:240px;overflow:auto;padding:12px;background:var(--sunk);border-radius:8px}.live-drop{display:block;border:1px dashed var(--line-strong);padding:12px;border-radius:10px;text-align:center;font-size:13px;cursor:pointer;background:var(--paper);transition:background .15s,border-color .15s}.live-drop span{color:var(--brand);text-decoration:underline}.live-drop.dragging{border-color:var(--brand);background:var(--brand-weak)}.live-drop.uploading{opacity:.6;pointer-events:none}.live-hint{font-size:11px;color:var(--muted);margin-top:4px}.live-upload-inline{max-width:832px;margin:0 auto 8px}.live-error{border-left:3px solid var(--gap);padding:10px 12px;background:var(--gap-weak);border-radius:6px;font-size:14px;overflow-wrap:anywhere}.live-answer{white-space:pre-wrap;overflow-wrap:anywhere}.live-pending{color:var(--muted);padding:14px 0;animation:pulse 1.5s infinite}.live-brief{display:grid;gap:18px;margin-top:24px}.live-brief h3{font-size:15px}.upload-feedback:empty{display:none}.upload-feedback{max-height:95px;overflow:auto;font-size:12px}.live-dialog details{margin-top:8px}.live-dialog summary{cursor:pointer;color:var(--brand)}.a-body .lead{line-height:1.7}.live-bar+.scenario{border-top:0}@media(max-width:700px){.live-bar{padding:8px 12px;gap:6px}.live-bar .row{gap:4px}.live-upload-inline .live-hint{display:none}.composer{padding-top:8px}.live-dialog{padding:16px}.live-bar .btn{font-size:11px}}
.live-versions{display:flex;gap:12px;font-size:12px;font-weight:600}.live-versions a{color:var(--brand);text-decoration:none}.live-versions a:hover{text-decoration:underline}.try li{display:list-item;margin-left:18px}.try ol{list-style:decimal}.try p{font-size:13px;color:var(--muted);line-height:1.5}@media(max-width:860px){.rail .try{display:none}.live-bar{gap:8px}.live-versions{gap:14px}}
/* Expert-verified answers, AI drafts in B, and gap cards in C */
.trail .pill.verified{margin-left:6px;font-size:11.5px;vertical-align:1px}
.field>span{display:block;margin-bottom:6px}
.gap-list{display:grid;gap:10px}
.gap-card{display:grid;gap:6px;padding:12px 14px;border:1px dashed var(--gap);border-radius:var(--r-md);background:color-mix(in srgb,var(--gap-weak) 45%,transparent)}
.gap-card .k{font-size:13px;line-height:1.45}
.gap-card .row{gap:8px}
.gap-card.done{border-style:solid;border-color:var(--brand);background:color-mix(in srgb,var(--brand-weak) 45%,transparent)}
.gap-track{margin-top:18px}
.gap-track .panel-b{gap:10px}

/* Version C: account page where the briefing arrives before any question */
.work-inner { max-width: 1140px; }
.page-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.page-h h1 { font-size: clamp(24px, 3.4vw, 30px); }
.page-h p { color: var(--muted); font-size: 14.5px; max-width: 60ch; }
.accounts { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.acc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); transition: background .2s, padding .3s var(--ease); animation: rise .45s var(--ease) both; }
.acc:nth-child(2) { animation-delay: .06s; } .acc:nth-child(3) { animation-delay: .12s; }
.acc:hover { background: var(--paper); padding-left: 20px; }
.acc:hover .acc-logo { transform: rotate(-6deg) scale(1.06); }
.acc:last-child { border-bottom: 0; }
.acc.new { background: var(--brand-weak); }
.acc.new:hover { background: color-mix(in srgb, var(--brand-weak) 70%, var(--surface)); }
.acc-logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font: 700 15px var(--f-display); color: #fff; transition: transform .4s var(--spring); }
.acc h3 { font: 650 15.5px var(--f-ui); }
.acc p { font-size: 13px; color: var(--muted); }
.acc-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.back { border: 0; background: transparent; color: var(--muted); font-size: 13.5px; padding: 0; margin-bottom: 10px; display: inline-flex; gap: 4px; align-items: center; transition: color .2s, transform .25s var(--ease); }
.back:hover { color: var(--brand); transform: translateX(-3px); }
.acct-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.acct-head .acc-logo { width: 48px; height: 48px; font-size: 18px; }
.acct-head h1 { font-size: clamp(24px, 3.4vw, 30px); }
.acct-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; transition: border-color .25s, box-shadow .35s var(--ease); }
.panel:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.side-col > .panel.reveal:nth-child(2) { animation-delay: .1s; } .side-col > .panel.reveal:nth-child(3) { animation-delay: .2s; }
.panel-h { padding: 14px 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel-h h2 { font-size: 16.5px; }
.panel-b { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.brief { box-shadow: var(--shadow); }
.brief:hover { box-shadow: var(--shadow-lift); }
.brief-top { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.brief-top h2 { font-size: 20px; }
.brief-top .lead { font-size: 15.5px; line-height: 1.55; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.tl { list-style: none; margin: 0; padding: 8px 20px 18px; }
.tl li { display: grid; grid-template-columns: 74px 20px minmax(0, 1fr); gap: 12px; position: relative; padding: 12px 8px 12px 0; border-radius: 10px; transition: background .2s; }
.tl li:hover { background: var(--paper); }
.tl.enter li { animation: rise .5s var(--ease) both; }
.tl.enter li:nth-child(2) { animation-delay: .08s; } .tl.enter li:nth-child(3) { animation-delay: .16s; } .tl.enter li:nth-child(4) { animation-delay: .24s; } .tl.enter li:nth-child(5) { animation-delay: .32s; }
.tl li::before { content: ""; position: absolute; left: 95px; top: 30px; bottom: -14px; width: 1.5px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl .when { font-size: 13px; color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.tl .node { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); display: grid; place-items: center; position: relative; z-index: 1; margin-top: 2px; transition: transform .3s var(--spring); }
.tl li:hover .node { transform: scale(1.2); }
.tl .node::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.tl li.gap .node { border-color: var(--gap); border-style: dashed; animation: ping 2s var(--ease) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gap) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 9px transparent; } }
.tl li.gap .node::after { background: transparent; border: 1.5px solid var(--gap); width: 4px; height: 4px; }
.tl .what { font-weight: 650; font-size: 15px; line-height: 1.35; }
.tl .why { font-size: 14px; line-height: 1.45; margin-top: 3px; }
.tl .why b { font-weight: 600; color: var(--muted); }
.tl li.gap .why { color: var(--gap); font-weight: 600; }
.tl li.closed .why { color: var(--ink); font-weight: 400; }
.tl .by { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.tl .by .avatar { width: 20px; height: 20px; font-size: 9px; }
.src { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.tl li.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--brand-weak); } 100% { background: transparent; } }
.person { display: flex; gap: 10px; align-items: center; }
.person div { min-width: 0; font-size: 14px; line-height: 1.35; }
.person div > span { display: block; font-size: 12.5px; color: var(--muted); }
.gapcard { border-color: color-mix(in srgb, var(--gap) 45%, var(--line)); }
.gapcard.closed { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.gq { font-weight: 650; font-size: 15px; line-height: 1.35; }
.small { font-size: 13.5px; color: var(--muted); line-height: 1.45; }

.reply { background: var(--brand-weak); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.ticket { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.ticket .id { font-family: var(--f-code); font-size: 12px; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 8px; }

.choices button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; transition: border-width .2s, border-color .2s; }
.choices button:hover { border-color: var(--brand); transform: translateX(3px); }

.choices button[aria-pressed="true"]::before { border: 4.5px solid var(--ink); }

.verdict.warn { background: var(--gap-weak); }
.verdict.bad { background: var(--risk-weak); }
.verdict.good { background: var(--brand-weak); }
.verdict b { display: block; margin-bottom: 2px; }

.recap h2 { font-size: 20px; }
.recap p { opacity: .85; max-width: 70ch; font-size: 14.5px; }
.prep { padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.skel { display: flex; flex-direction: column; gap: 9px; }
.skel i { display: block; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--sunk) 0%, var(--line) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function toast(msg) {
  let box = $(".toasts");
  if (!box) { box = document.createElement("div"); box.className = "toasts"; box.setAttribute("role", "status"); document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="dot">' + TICK + '</span><span>' + msg + '</span><span class="bar"></span>';
  box.appendChild(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => { t.classList.add("leaving"); setTimeout(() => t.remove(), 320); }, 4200);
}

/* stream words into an element, keeping inline markup intact by revealing tokens */
async function stream(el, html, id, speed = 18) {
  el.classList.add("typing");
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  const words = [];
  (function walk(node, parent) {
    node.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        n.textContent.split(/(\s+)/).forEach((w) => { if (w) words.push({ parent, text: w }); });
      } else {
        const clone = n.cloneNode(false);
        words.push({ parent, node: clone });
        walk(n, clone);
      }
    });
  })(tmp, el);
  for (const w of words) {
    if (!alive(id)) return;
    if (w.node) w.parent.appendChild(w.node);
    else { w.parent.appendChild(document.createTextNode(w.text)); if (/\S/.test(w.text)) await wait(speed); }
  }
  el.classList.remove("typing");
}

/* animate a number change */
function countTo(el, to, suffix = "") {
  if (!el) return;
  const from = parseInt(el.textContent, 10) || 0;
  if (from === to) { el.textContent = to + suffix; return; }
  const t0 = performance.now(), dur = REDUCED ? 1 : 700;
  el.classList.add("bump");
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e) + suffix;
    if (k < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove("bump"), 500);
  })(t0);
}

/* "Try this" checklist in the rail */
function Checklist(root, steps) {
  let done = 0, just = -1;
  function render() {
    root.innerHTML = "<h4>Try this</h4><ol>" + steps.map((s, i) => {
      const cls = (i < done ? "done" : i === done ? "now" : "") + (i === just ? " just" : "");
      const mark = i < done ? TICK : String(i + 1);
      return '<li class="' + cls + '"><span class="tick" aria-hidden="true">' + mark + "</span><span>" + s + "</span></li>";
    }).join("") + "</ol>" + (done >= steps.length ? '<p class="finished">All steps done. Restart to run it again.</p>' : "");
  }
  render();
  return {
    complete(i) { if (i < done) return; just = i; done = i + 1; render(); },
    reset() { done = 0; just = -1; render(); },
    get step() { return done; },
  };
}

/* thinking steps; resolves after all are shown */
async function think(container, labels, id, each = 650) {
  const box = document.createElement("div");
  box.className = "thinking";
  container.appendChild(box);
  for (const l of labels) {
    if (!alive(id)) return box;
    const s = document.createElement("div");
    s.className = "step";
    s.innerHTML = '<span class="spin"></span><span>' + l + "</span>";
    box.appendChild(s);
    await wait(each);
    s.classList.add("done");
  }
  return box;
}

function scrollDown(el) {
  el.scrollTo({ top: el.scrollHeight, behavior: REDUCED ? "auto" : "smooth" });
  clearTimeout(el._sd);
  el._sd = setTimeout(() => el.scrollTo({ top: el.scrollHeight, behavior: "auto" }), 420);
}

// Public backend URL only. Never place an API key in this file.
window.SYNAPTIQ_API_BASE = "https://synaptiq-class-demo.swoonyspice130.chatgpt.site";

/* Shared live workspace. API credentials are held by server.py, never in this browser. */
const Live = (() => {
  const E = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let base = window.SYNAPTIQ_API_BASE || localStorage.getItem('synaptiq-api') || '';
  const incoming = new URLSearchParams(location.search).get('api');
  const validBase = s => { const u = new URL(s); if (u.protocol !== 'https:' && !(u.protocol === 'http:' && ['localhost','127.0.0.1'].includes(u.hostname))) throw Error('Use an HTTPS backend URL.'); if (u.username || u.password || u.search || u.hash || u.pathname !== '/') throw Error('Enter only the backend origin, for example https://your-service.example.com'); return u.origin; };
  if (incoming) { try { base = validBase(incoming); localStorage.setItem('synaptiq-api', base); } catch {} }
  if (!base && ['localhost','127.0.0.1'].includes(location.hostname)) base = location.origin;
  let health = null, shared = null;
  const busyButtons = new Set();
  function endpoint(path) { if (!base) throw Error('Connect the hosted workspace using “Connect workspace” above.'); return base + path; }
  async function request(path, body) {
    const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 65000);
    try {
      const res = await fetch(endpoint(path), {method: body ? 'POST' : 'GET', headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, signal: controller.signal});
      let data; try { data = await res.json(); } catch { throw Error('That URL is not the Synaptiq backend. Check the workspace connection.'); }
      if (!res.ok) throw Error(data.error || 'Request failed. Please retry.'); return data;
    } catch (err) { if (err.name === 'AbortError') throw Error('The server took too long. It may be waking up; please retry.'); if (err instanceof TypeError) throw Error('Could not reach the workspace. Check your connection and backend URL.'); throw err; }
    finally { clearTimeout(timer); }
  }
  function link(version) {
    const home = document.querySelector('.rail-foot a')?.getAttribute('href') || './';
    const url = new URL(home, location.href);
    url.search = ''; url.hash = '';
    if (version) url.pathname = url.pathname.replace(/\/?$/, '/') + version + '/';
    if (base) url.searchParams.set('api', base);
    return url.href;
  }
  function propagate() {
    document.querySelectorAll('a[href]').forEach(a => { try {const u = new URL(a.href); if (base && u.origin === location.origin && !a.getAttribute('href').startsWith('#') && !a.hasAttribute('download')) {u.searchParams.set('api',base); a.href=u.href;}} catch {} });
  }
  function error(container, err) { const p=document.createElement('p'); p.className='live-error'; p.setAttribute('role','alert'); p.textContent=err.message || String(err); container.appendChild(p); }
  async function task(button, work) { if (busyButtons.has(button)) return; busyButtons.add(button); button.disabled=true; try {await work();} catch(e) {toast(E(e.message));} finally {button.disabled=false; busyButtons.delete(button);} }
  const day = t => new Date(t*1000).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  // Expert-approved answers get a "Verified by" badge and show where they apply.
  function sourceList(sources) { return sources.length ? `<ul class="trail">${sources.map(s=>`<li><span class="node"></span><span><b>${E(s.verified ? s.title.replace(/^Expert answer: /,'') : s.title)}</b>${s.verified?` <span class="pill ok verified">✓ Verified by ${E(s.owner)} · ${day(s.created)}</span>`:''}<br><span class="k">${s.verified?'Expert answer':E(s.owner)+' · added '+day(s.created)}${s.scope?` · Applies to: ${E(s.scope)}`:''}</span></span></li>`).join('')}</ul>` : ''; }
  // Questions routed from C start with this marker, so B and C can show where a gap came from.
  const C_MARKER = 'Flagged by Context Briefing (C).';
  async function refreshState() { shared=await request('/api/state'); return shared; }
  async function check() {
    const status=document.querySelector('#liveStatus');
    try {health=await request('/api/health'); status.textContent=health.ai_configured ? 'Live AI · shared workspace' : 'Workspace connected · AI key needed'; status.className='pill '+(health.ai_configured?'ok':'gap'); await refreshState();}
    catch(e) {status.textContent=base ? 'Workspace offline · reconnect' : 'Connect workspace to use live AI';status.className='pill gap';health=null;}
  }
  function setup() {
    const brand = document.querySelector('#brand');
    if (brand && !brand.innerHTML.trim()) brand.innerHTML = BRAND;
    const bar=document.createElement('div'); bar.className='live-bar';
    bar.innerHTML=`<span id="liveStatus" class="pill plain">Connecting workspace…</span><nav class="live-versions" aria-label="Switch prototype"><a href="${E(link('a'))}">A · Ask</a><a href="${E(link('b'))}">B · Expert</a><a href="${E(link('c'))}">C · Briefing</a></nav><div class="row"><button class="btn quiet" id="liveDocs" type="button">Company documents</button><button class="btn quiet" id="liveConnect" type="button">Connect workspace</button><button class="btn quiet" id="liveReset" type="button">Reset shared demo</button></div>`;
    const main=document.querySelector('.main') || document.querySelector('.page'); main.prepend(bar);
    document.querySelector('#liveConnect').onclick=connect;
    document.querySelector('#liveDocs').onclick=documents;
    document.querySelector('#liveReset').onclick=e=>task(e.currentTarget,async()=>{if(!confirm('Reset the shared demo for everyone? This removes uploaded documents, routed questions and expert answers. Seed documents stay.'))return; await request('/api/reset',{confirm:'RESET DEMO'});location.reload();});
    propagate(); check();
  }
  function dialog(title,html) {
    document.querySelector('#liveDialog')?.remove();const d=document.createElement('dialog');d.id='liveDialog';d.className='live-dialog';
    d.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${E(title)}</h2><button class="btn quiet" type="button" data-close>Close</button></div><div class="live-dialog-body">${html}</div>`;
    document.body.appendChild(d);d.querySelector('[data-close]').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());d.showModal();return d;
  }
  function connect() {
    const d=dialog('Connect your demo workspace',`<p>Enter the public URL of your hosted Synaptiq backend. All three versions use this same workspace. This field is for a URL, never an API key.</p><label>Backend URL<input id="backendUrl" type="url" placeholder="https://your-synaptiq-backend.example.com" value="${E(base)}"></label><button class="btn primary" id="saveBackend">Connect</button><p class="k">Use the same URL on another laptop, or share a version link after connecting.</p><div id="connectError"></div>`);
    d.querySelector('#saveBackend').onclick=e=>task(e.currentTarget,async()=>{const c=d.querySelector('#connectError');c.replaceChildren();try {const proposed=validBase(d.querySelector('#backendUrl').value.trim());const r=await fetch(proposed+'/api/health',{signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok||data.ok!==true)throw Error('This is not a Synaptiq backend.');base=proposed;localStorage.setItem('synaptiq-api',base);const u=new URL(location.href);u.searchParams.set('api',base);history.replaceState(null,'',u);propagate();await check();d.close();toast('Workspace connected.');window.dispatchEvent(new Event('workspace-connected'));}catch(err){error(c,err);}});
  }
  async function uploadFiles(files, output) {
    for (const file of files) {
      if(file.size>4*1024*1024) {error(output,Error(file.name+': choose a file under 4 MB.'));continue;}
      const p=document.createElement('p');p.textContent='Uploading '+file.name+'…';output.appendChild(p);
      try {const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('Could not read file.'));reader.readAsDataURL(file);});await request('/api/upload',{name:file.name,data});p.textContent=file.name+' added to company knowledge. Ask your question again.';p.className='saved-note';}
      catch(e){p.className='live-error';p.textContent=file.name+': '+e.message;}
    }
    await refreshState().catch(()=>{});window.dispatchEvent(new Event('knowledge-updated'));
  }
  function uploadZone(container) {
    container.innerHTML=`<label class="live-drop" tabindex="0">Drop company files here, or <span>choose files</span><input type="file" multiple accept=".txt,.md,.csv,.json,.log,.docx,.pdf,.png,.jpg,.jpeg,.webp" hidden></label><p class="k live-hint">Text, Word, PDF, or a readable floor-plan image · up to 4 MB per file · fictional demo data only</p><div class="upload-feedback" aria-live="polite"></div>`;
    const zone=container.querySelector('.live-drop'), picker=zone.querySelector('input'), output=container.querySelector('.upload-feedback');let uploading=false;
    const run=async files=>{if(uploading)return;uploading=true;zone.classList.add('uploading');try{await uploadFiles(files,output);}catch(e){error(output,e);}finally{uploading=false;zone.classList.remove('uploading');picker.value='';}};
    picker.onchange=()=>run([...picker.files]);zone.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();picker.click();}};
    for(const name of ['dragenter','dragover'])zone.addEventListener(name,e=>{e.preventDefault();zone.classList.add('dragging');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('dragging'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragging');run([...e.dataTransfer.files]);});
  }
  async function documents() {
    const d=dialog('Company knowledge',`<p>These documents and expert-approved answers are shared by A, B and C.</p><div id="docUpload"></div><div id="docList">Loading…</div>`);uploadZone(d.querySelector('#docUpload'));
    async function list(){try{const s=await refreshState();if(!d.isConnected)return;const root=d.querySelector('#docList');root.innerHTML=s.documents.map(doc=>`<article class="live-document"><b>${E(doc.title)}</b><p class="k">${E(doc.owner)}</p>${doc.mime==='text/plain'?`<details><summary>Read document</summary><pre>${E(doc.text)}</pre></details>`:'<p class="k">Visual document available to the model</p>'}${!doc.id.startsWith('seed-')&&!doc.id.startsWith('answer-')?`<button class="btn quiet" data-delete="${E(doc.id)}">Remove</button>`:''}</article>`).join('');root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>task(b,async()=>{await request('/api/delete-document',{id:b.dataset.delete});await list();}));}catch(e){const root=d.querySelector('#docList');root.textContent=e.message;}}
    const changed=()=>list();window.addEventListener('knowledge-updated',changed);d.addEventListener('close',()=>window.removeEventListener('knowledge-updated',changed));await list();
  }
  function mountA(){
    setup();let busy=false;const thread=document.querySelector('#thread'),input=document.querySelector('#askInput'),button=document.querySelector('#askBtn'),work=document.querySelector('#work');
    document.querySelector('#try').innerHTML='<h4>Try this</h4><ol><li>Ask any company question.</li><li>Route missing knowledge to an expert in B.</li><li>Publish the answer in B, then ask again here.</li><li>Or upload a document and ask again.</li></ol>';
    document.querySelector('#restart').onclick=()=>{if(!busy)start();};
    document.querySelector('.nav').innerHTML=`<a class="on" href="#">Ask</a><a href="${link('b')}">Open expert inbox B</a><a href="${link('c')}">Context briefing C</a>`;
    const upload=document.createElement('div');upload.className='live-upload-inline';document.querySelector('.composer').prepend(upload);uploadZone(upload);
    function start(){thread.innerHTML='<div class="empty"><h1>What do you need to know?</h1><p>Ask freely. Synaptiq answers from company knowledge, shows its sources, and helps capture what nobody has written down.</p><div class="suggest"><button data-question="How do I run payments-retry tests locally?">How do I run payments-retry tests locally?</button><button data-question="Why does payments-retry stop after three retries?">Why does payments-retry stop after three retries?</button><button data-question="Where are the bathrooms in this office?">Where are the bathrooms in this office?</button></div></div>';thread.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>ask(b.dataset.question));document.querySelector('#chips').replaceChildren();input.value='';}
    async function ask(question){if(busy||!question.trim())return;busy=true;button.disabled=true;input.disabled=true;thread.querySelector('.empty')?.remove();const q=document.createElement('div');q.className='q';q.textContent=question;thread.appendChild(q);const a=document.createElement('div');a.className='a';a.innerHTML=`<div class="a-mark">${LOGO}</div><div class="a-body"><p class="live-pending" role="status">Reading current company knowledge…</p></div>`;thread.appendChild(a);const body=a.querySelector('.a-body');scrollDown(work);
      try{const r=await request('/api/ask',{question});const verified=r.status==='answered'&&r.sources.some(s=>s.verified);body.innerHTML=`<article class="kcard"><div class="kcard-head"><h3>${r.status==='answered'?'Answer from company knowledge':'Knowledge gap'}</h3><span class="pill ${r.status==='answered'?'ok':'gap'}">${verified?'Expert-verified':r.status==='answered'?'Sources found':'Not documented'}</span></div><div class="kcard-body"><p class="lead live-answer">${E(r.answer)}</p>${sourceList(r.sources)}${r.status==='missing'?`<div class="expert"><div class="who"><strong>${E(r.expert.name)}</strong><span>${E(r.expert_reason)}</span></div><button class="btn primary" data-route>Ask this expert</button></div>`:''}</div></article>`;
        const route=body.querySelector('[data-route]');if(route)route.onclick=()=>task(route,async()=>{await request('/api/route',{question,expert_id:r.expert.id,evidence:r.answer});route.textContent='Sent to expert inbox';const p=document.createElement('p');p.innerHTML=`<a class="btn primary" href="${E(link('b'))}" target="_blank" rel="noopener">Open B to answer it</a> <span class="k">Return here and ask again after publishing.</span>`;body.appendChild(p);});
      }catch(err){body.replaceChildren();error(body,err);const retry=document.createElement('button');retry.className='btn';retry.textContent='Retry question';retry.onclick=()=>ask(question);body.appendChild(retry);}finally{busy=false;button.disabled=false;input.disabled=false;input.focus();scrollDown(work);}}
    document.querySelector('#ask').onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(!q||busy)return;input.value='';ask(q);};start();
  }
  function mountB(){
    setup();const view=document.querySelector('#view');let selected=null;let editing=false;let fingerprint='';
    // AI drafts, kept per question so the inbox refresh doesn't ask the model again.
    const drafts={};const drafting=new Set();
    async function fillDraft(id,box){
      if(id in drafts){if(!box.value)box.value=drafts[id];return;}
      const status=view.querySelector('#draftStatus');if(status)status.hidden=false;
      if(drafting.has(id))return;drafting.add(id);
      try{drafts[id]=(await request('/api/draft',{id})).draft;}
      catch(e){drafts[id]='';const s=view.querySelector('#draftStatus');if(s){s.hidden=false;s.className='live-error';s.textContent='Could not draft this one ('+e.message+') Write your answer below.';}return;}
      finally{drafting.delete(id);}
      const current=view.querySelector('#expertAnswer');if(selected===id&&current&&!current.value)current.value=drafts[id];
      const s=view.querySelector('#draftStatus');if(selected===id&&s)s.hidden=true;
    }
    document.querySelector('#try').innerHTML='<h4>Live expert workflow</h4><p>Questions routed from A and gaps sent from C appear here with a draft. Fill in what only you know, publish it, then ask A again.</p>';
    document.querySelector('#pageSub').textContent='Real questions from A and gaps spotted by C. Your published explanations become shared company knowledge.';
    document.querySelector('.tabs').innerHTML='<button class="btn" type="button" id="refreshInbox">Refresh inbox</button>';
    document.querySelector('#refreshInbox').onclick=e=>task(e.currentTarget,()=>render(true));document.querySelector('#restart').textContent='Refresh inbox';document.querySelector('#restart').onclick=()=>render(true);
    document.querySelector('.nav').innerHTML=`<a class="on" href="#">Expert inbox <span class="count" id="liveInboxCount">0</span></a><a href="${link('a')}">Ask Synaptiq A</a><a href="${link('c')}">Context briefing C</a>`;
    async function render(force=false){if(editing&&!force)return;try{const s=await refreshState();const key=JSON.stringify(s.questions);if(!force&&key===fingerprint)return;fingerprint=key;const pending=s.questions.filter(q=>q.status==='pending');document.querySelector('#liveInboxCount').textContent=pending.length;selected=pending.some(q=>q.id===selected)?selected:pending[0]?.id;const q=pending.find(q=>q.id===selected);view.innerHTML=`<section class="ledger"><div><b>${pending.length}</b><span>questions awaiting your expertise</span></div><div><b>${s.questions.filter(q=>q.status==='published').length}</b><span>answers actually published</span></div><div><b>${s.documents.length}</b><span>shared knowledge sources</span></div></section>${q?`<div class="panes"><section class="list"><div class="list-head">Questions for you</div>${pending.map(i=>`<button class="item" data-select="${E(i.id)}" aria-current="${i.id===selected}"><span class="q">${E(i.question)}</span><span class="meta">${E(s.experts.find(e=>e.id===i.expert)?.name)} · awaiting answer</span></button>`).join('')}</section><section class="detail"><div class="d-head"><div class="row"><span class="pill gap">Needs human expertise</span>${q.evidence.startsWith(C_MARKER)?'<span class="pill plain">From C · spotted before anyone asked</span>':'<span class="pill plain">From A · asked by an engineer</span>'}</div><h2>${E(q.question)}</h2></div><div class="d-body"><p class="k">Assigned to ${E(s.experts.find(e=>e.id===q.expert)?.name)}. You are playing this expert for the demo.</p><details><summary>What Synaptiq found</summary><p class="live-answer">${E(q.evidence.replace(C_MARKER,'').trim())}</p></details><label class="field"><span>Draft by Synaptiq <span class="k">· fill in each [Confirm: …], edit anything, then approve</span></span><textarea id="expertAnswer" placeholder="Synaptiq is drafting an answer from what it found…"></textarea></label><p class="live-pending" id="draftStatus" hidden>Synaptiq is drafting an answer from what it found…</p><label class="field">Applies to<input id="answerScope" value="Company knowledge" placeholder="For example: payments-retry only"></label><button class="btn primary" id="publishLive">Approve and publish to company memory</button><div id="publishFeedback" aria-live="polite"></div></div></section></div>`:`<section class="detail done-state"><h2>No unanswered questions</h2><p>Ask A something the documents don't explain and choose “Ask this expert,” or send an open gap from C. It will arrive here automatically.</p><a class="btn primary" href="${E(link('a'))}">Open A</a></section>`}`;
      view.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{if(editing&&!confirm('Discard your unpublished draft?'))return;editing=false;selected=b.dataset.select;render(true);});
      const answer=view.querySelector('#expertAnswer');if(answer){answer.oninput=()=>editing=true;fillDraft(q.id,answer);}
      const publish=view.querySelector('#publishLive');if(publish)publish.onclick=()=>task(publish,async()=>{const feedback=view.querySelector('#publishFeedback');feedback.replaceChildren();try{if(/\[Confirm:/i.test(answer.value))throw Error('Replace each [Confirm: …] with what you know before publishing.');await request('/api/publish',{id:q.id,answer:answer.value,scope:view.querySelector('#answerScope').value});editing=false;await render(true);toast('Published. A and C can now use your answer.');const note=document.createElement('p');note.className='saved-note';note.innerHTML=`Answer saved. <a href="${E(link('a'))}">Return to A and ask again →</a>`;view.prepend(note);}catch(e){error(feedback,e);}});
    }catch(err){if(!view.querySelector('#expertAnswer')){view.replaceChildren();error(view,err);}}}
    window.addEventListener('focus',()=>render());window.addEventListener('workspace-connected',()=>render(true));setInterval(()=>{if(!document.hidden)render();},4000);render(true);
  }
  function mountC(){
    setup();document.querySelector('#try').innerHTML='<h4>Live context briefing</h4><ol><li>Generate the briefing.</li><li>Send an open gap to its expert.</li><li>Answer it in B.</li><li>Come back here: the gap shows as resolved.</li></ol>';
    const view=document.querySelector('#view');document.querySelector('#restart').textContent='Refresh briefing';document.querySelector('#restart').onclick=brief;
    document.querySelector('.nav').innerHTML=`<a class="on" href="#">Customer briefing</a><a href="${link('a')}">Ask Synaptiq A</a><a href="${link('b')}">Expert inbox B</a>`;
    let gaps=[];
    function intro(){view.innerHTML='<div class="page-h"><h1>Bluewater Logistics</h1><p>Your customer handoff, grounded in the current shared company knowledge.</p></div><section class="panel"><div class="panel-b"><p>See what changed, why it changed, who knows, and which decisions still need an explanation.</p><button class="btn primary" id="generateBrief">Generate current briefing</button><div id="briefResult" aria-live="polite"></div></div></section><section class="panel gap-track"><div class="panel-h"><h2>Gap tracker</h2><span class="k">Gaps sent from this briefing to experts</span></div><div class="panel-b" id="gapTrack"></div></section>';document.querySelector('#generateBrief').onclick=brief;}
    const expertName=(s,id)=>E(s.experts.find(e=>e.id===id)?.name||'the expert');
    // One card per open gap: why Synaptiq thinks it's a gap, and a button to send it to the expert.
    function gapCards(s){return gaps.map((g,i)=>{const sent=s.questions.find(q=>q.question===g.question);
      const action=!sent?`<button class="btn primary" type="button" data-gap="${i}">Ask ${E(g.expert.name)}</button>`:sent.status==='published'?`<span class="pill ok">Resolved by ${expertName(s,sent.expert)}</span>`:`<span class="pill plain">Waiting on ${expertName(s,sent.expert)}</span><a class="btn quiet" href="${E(link('b'))}" target="_blank" rel="noopener">Open B to answer it</a>`;
      return `<article class="gap-card"><b>${E(g.question)}</b><p class="k">Why this is a gap: ${E(g.reason)}</p><div class="row">${action}</div></article>`;}).join('');}
    // Every gap C has sent to an expert, with its status. Persists across briefings and page reloads.
    function tracker(s){const sent=s.questions.filter(q=>q.evidence.startsWith(C_MARKER));if(!sent.length)return '<p class="k">Nothing sent yet. Generate the briefing, then send an open gap to its expert.</p>';
      return sent.map(q=>`<article class="gap-card ${q.status==='published'?'done':''}"><div class="row">${q.status==='published'?`<span class="pill ok">Resolved by ${expertName(s,q.expert)}</span>`:`<span class="pill gap">Waiting on ${expertName(s,q.expert)}</span>`}</div><b>${E(q.question)}</b>${q.status==='published'?`<p class="live-answer">${E(q.answer)}</p>`:''}</article>`).join('')+(sent.some(q=>q.status==='published')?'<p class="k">Refresh the briefing to see resolved answers folded in.</p>':'');}
    async function update(){try{const s=await refreshState();const list=document.querySelector('#gapList'),track=document.querySelector('#gapTrack');
      const changed=(el,html)=>{if(el.dataset.html===html)return false;el.dataset.html=html;el.innerHTML=html;return true;};
      if(list&&changed(list,gapCards(s))){list.querySelectorAll('[data-gap]').forEach(b=>b.onclick=()=>task(b,async()=>{const g=gaps[b.dataset.gap];await request('/api/route',{question:g.question,expert_id:g.expert.id,evidence:C_MARKER+' '+g.reason});toast('Sent to '+E(g.expert.name)+"'s inbox.");await update();}));}
      if(track)changed(track,tracker(s));}catch(e){}}
    async function brief(){const b=document.querySelector('#generateBrief');if(b.disabled)return;b.disabled=true;const root=document.querySelector('#briefResult');root.innerHTML='<p class="live-pending">Reading current documents and expert answers…</p>';try{const r=await request('/api/brief',{});gaps=r.gaps||[];root.innerHTML=`<article class="live-brief"><p class="live-answer">${E(r.answer)}</p>${gaps.length?'<h3>Open gaps Synaptiq spotted</h3><div class="gap-list" id="gapList"></div>':''}<h3>Supporting sources</h3>${sourceList(r.sources)}<a class="btn" href="${E(link('a'))}">Ask a follow-up in A</a></article>`;await update();}catch(e){root.replaceChildren();error(root,e);}finally{b.disabled=false;b.textContent='Refresh from company knowledge';}}
    intro();update();window.addEventListener('focus',update);window.addEventListener('workspace-connected',update);setInterval(()=>{if(!document.hidden)update();},4000);
  }
  return {mountA,mountB,mountC,setup};
})();

Live.mountC();
</script>

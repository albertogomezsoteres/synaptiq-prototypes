<title>Synaptiq Context Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/*SHARED_CSS*/
/* Version C: account page where the briefing arrives before any question */
.work-inner { max-width: 1140px; }
.page-h { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.page-h h1 { font-size: clamp(24px, 3.4vw, 30px); }
.page-h p { color: var(--muted); font-size: 14.5px; max-width: 60ch; }
.accounts { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.acc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); transition: background .2s, padding .3s var(--ease); animation: rise .45s var(--ease) both; }
.acc:nth-child(2) { animation-delay: .06s; } .acc:nth-child(3) { animation-delay: .12s; }
.acc:hover { background: var(--paper); padding-left: 20px; }
.acc:hover .acc-logo { transform: rotate(-6deg) scale(1.06); }
.acc:last-child { border-bottom: 0; }
.acc.new { background: var(--brand-weak); }
.acc.new:hover { background: color-mix(in srgb, var(--brand-weak) 70%, var(--surface)); }
.acc-logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font: 700 15px var(--f-display); color: #fff; transition: transform .4s var(--spring); }
.acc h3 { font: 650 15.5px var(--f-ui); }
.acc p { font-size: 13px; color: var(--muted); }
.acc-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.back { border: 0; background: transparent; color: var(--muted); font-size: 13.5px; padding: 0; margin-bottom: 10px; display: inline-flex; gap: 4px; align-items: center; transition: color .2s, transform .25s var(--ease); }
.back:hover { color: var(--brand); transform: translateX(-3px); }
.acct-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.acct-head .acc-logo { width: 48px; height: 48px; font-size: 18px; }
.acct-head h1 { font-size: clamp(24px, 3.4vw, 30px); }
.acct-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.side-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; transition: border-color .25s, box-shadow .35s var(--ease); }
.panel:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.side-col > .panel.reveal:nth-child(2) { animation-delay: .1s; } .side-col > .panel.reveal:nth-child(3) { animation-delay: .2s; }
.panel-h { padding: 14px 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.panel-h h2 { font-size: 16.5px; }
.panel-b { padding: 12px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.brief { box-shadow: var(--shadow); }
.brief:hover { box-shadow: var(--shadow-lift); }
.brief-top { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.brief-top h2 { font-size: 20px; }
.brief-top .lead { font-size: 15.5px; line-height: 1.55; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.tl { list-style: none; margin: 0; padding: 8px 20px 18px; }
.tl li { display: grid; grid-template-columns: 74px 20px minmax(0, 1fr); gap: 12px; position: relative; padding: 12px 8px 12px 0; border-radius: 10px; transition: background .2s; }
.tl li:hover { background: var(--paper); }
.tl.enter li { animation: rise .5s var(--ease) both; }
.tl.enter li:nth-child(2) { animation-delay: .08s; } .tl.enter li:nth-child(3) { animation-delay: .16s; } .tl.enter li:nth-child(4) { animation-delay: .24s; } .tl.enter li:nth-child(5) { animation-delay: .32s; }
.tl li::before { content: ""; position: absolute; left: 95px; top: 30px; bottom: -14px; width: 1.5px; background: var(--line); }
.tl li:last-child::before { display: none; }
.tl .when { font-size: 13px; color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.tl .node { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--brand); background: var(--surface); display: grid; place-items: center; position: relative; z-index: 1; margin-top: 2px; transition: transform .3s var(--spring); }
.tl li:hover .node { transform: scale(1.2); }
.tl .node::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.tl li.gap .node { border-color: var(--gap); border-style: dashed; animation: ping 2s var(--ease) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gap) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 9px transparent; } }
.tl li.gap .node::after { background: transparent; border: 1.5px solid var(--gap); width: 4px; height: 4px; }
.tl .what { font-weight: 650; font-size: 15px; line-height: 1.35; }
.tl .why { font-size: 14px; line-height: 1.45; margin-top: 3px; }
.tl .why b { font-weight: 600; color: var(--muted); }
.tl li.gap .why { color: var(--gap); font-weight: 600; }
.tl li.closed .why { color: var(--ink); font-weight: 400; }
.tl .by { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.tl .by .avatar { width: 20px; height: 20px; font-size: 9px; }
.src { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.tl li.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--brand-weak); } 100% { background: transparent; } }
.person { display: flex; gap: 10px; align-items: center; }
.person div { min-width: 0; font-size: 14px; line-height: 1.35; }
.person div > span { display: block; font-size: 12.5px; color: var(--muted); }
.gapcard { border-color: color-mix(in srgb, var(--gap) 45%, var(--line)); }
.gapcard.closed { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.gq { font-weight: 650; font-size: 15px; line-height: 1.35; }
.small { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.draft { display: flex; flex-direction: column; gap: 8px; }
.draft textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 9px 11px; font-size: 14px; line-height: 1.45; }
.waiting { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.waiting .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.reply { background: var(--brand-weak); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.ticket { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.ticket .id { font-family: var(--f-code); font-size: 12px; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: border-color .2s, background .2s, transform .25s var(--ease); }
.choices button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; transition: border-width .2s, border-color .2s; }
.choices button:hover { border-color: var(--brand); transform: translateX(3px); }
.choices button[aria-pressed="true"] { border-color: var(--ink); background: var(--paper); }
.choices button[aria-pressed="true"]::before { border: 4.5px solid var(--ink); }
.verdict { border-radius: var(--r-md); padding: 10px 12px; font-size: 14px; line-height: 1.45; }
.verdict.warn { background: var(--gap-weak); }
.verdict.bad { background: var(--risk-weak); }
.verdict.good { background: var(--brand-weak); }
.verdict b { display: block; margin-bottom: 2px; }
.recap { margin-top: 18px; padding: 18px 20px; border-radius: var(--r-lg); background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; gap: 6px; }
.recap h2 { font-size: 20px; }
.recap p { opacity: .85; max-width: 70ch; font-size: 14.5px; }
.prep { padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.skel { display: flex; flex-direction: column; gap: 9px; }
.skel i { display: block; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--sunk) 0%, var(--line) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.skel i:nth-child(1) { width: 92%; } .skel i:nth-child(2) { width: 78%; } .skel i:nth-child(3) { width: 85%; } .skel i:nth-child(4) { width: 40%; }
.prep h2 { font-size: 18px; }
@media (max-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  .acc { grid-template-columns: 36px minmax(0, 1fr); }
  .acc-r { grid-column: 1 / -1; justify-content: flex-start; }
  .tl { padding-left: 14px; padding-right: 14px; }
  .tl li { grid-template-columns: 20px minmax(0, 1fr); }
  .tl li::before { left: 9px; }
  .tl .when { grid-column: 2; grid-row: 1; }
  .tl .node { grid-column: 1; grid-row: 1 / span 2; }
  .tl .body { grid-column: 2; }
  .brief-top { padding: 16px 14px; }
}
</style>

<div class="app">
  <aside class="rail">
    <a class="brand" id="brand" href="{{HOME}}" aria-label="Synaptiq, all versions"></a>
    <div class="workspace"><div class="ws-logo">C</div><div class="ws-meta"><strong>Corvex Payments</strong><span>Solutions engineering</span></div></div>
    <nav class="nav" aria-label="Synaptiq">
      <a class="on" href="#accounts" onclick="return false">My accounts <span class="count">3</span></a>
      <a href="#briefings" onclick="return false">Briefings</a>
      <a href="#gaps" onclick="return false">Open gaps <span class="count" id="gapCount">1</span></a>
    </nav>
    <section class="try" id="try" aria-label="Demo steps"></section>
    <div class="rail-foot">
      <span>Version C of 3</span>
      <a href="{{HOME}}">All three versions</a>
    </div>
  </aside>

  <div class="main">
    <div class="scenario">
      <div class="who" aria-hidden="true">N</div>
      <p><b>You're Nico, a solutions engineer at Corvex Payments.</b> This morning you were assigned a customer you've never worked with. You haven't asked anything yet.</p>
      <button class="restart" id="restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restart demo</button>
    </div>
    <div class="work" id="work"><div class="work-inner" id="view"></div></div>
  </div>
</div>

Live.mountC();
